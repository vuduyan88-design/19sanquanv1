<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />

  <title>Hệ thống Quản lý Lưu trú & Hợp đồng · 19 Sân Quần</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <script src="https://unpkg.com/lucide@latest"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    /* =========================================================================
       DESIGN SYSTEM TOKENS (KẾ THỪA PHONG CÁCH TỪ HÌNH ẢNH THAM CHIẾU)
       ========================================================================= */
    :root {
      --ds-blue-primary: #39A7F8;
      --ds-blue-bright: #50B3F9;
      --ds-blue-pill: #75C4FC;
      --ds-blue-tint: #E3F4FF;
      --ds-indigo-deep: #4935F5;
      --ds-bg-canvas: #F5FCFF;
      --ds-surface-white: #FFFFFF;
      --ds-text-main: #162B40;
      --ds-text-sub: #627D98;
      --ds-text-on-blue: #FFFFFF;
      --ds-text-on-blue-sub: #E3F4FF;
      --ds-border-soft: rgba(57, 167, 248, 0.18);
      --ds-radius-phone: 44px;
      --ds-radius-card: 26px;
      --ds-radius-icon: 20px;
      --ds-radius-pill: 9999px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background-color: #EBF6FE;
      color: var(--ds-text-main);
      overflow-x: hidden;
    }

    /* Khung hiển thị thích ứng Mobile (toàn màn hình) & Máy tính (hài hòa hoặc khung Smartphone) */
    .ds-stage {
      min-height: 100vh;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      background: linear-gradient(180deg, #E8F5FE 0%, #F5FCFF 100%);
    }

    .ds-shell {
      width: 100%;
      min-height: 100vh;
      background: var(--ds-bg-canvas);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    @media (min-width: 640px) {
      .ds-stage {
        padding: 18px 20px 28px 20px;
      }
      .ds-shell.mode-desktop {
        max-width: 1060px;
        min-height: calc(100vh - 46px);
        border-radius: 34px;
        border: 3px solid rgba(57, 167, 248, 0.28);
        box-shadow: 0 22px 55px -18px rgba(22, 43, 64, 0.12);
        overflow: hidden;
      }
      .ds-shell.mode-phone {
        width: 416px;
        max-width: 100%;
        height: 840px;
        min-height: 840px;
        max-height: 92vh;
        border-radius: var(--ds-radius-phone);
        border: 8px solid var(--ds-indigo-deep);
        box-shadow:
          0 28px 64px -16px rgba(73, 53, 245, 0.34),
          0 0 0 2px #181C2E inset;
        overflow: hidden;
      }
    }

    /* Signature Blue Card (Đặc trưng từ ảnh tham chiếu) */
    .ds-blue-card {
      background: linear-gradient(145deg, var(--ds-blue-primary) 0%, var(--ds-blue-bright) 100%);
      border-radius: var(--ds-radius-card);
      color: var(--ds-text-on-blue);
      box-shadow: 0 12px 26px -10px rgba(57, 167, 248, 0.48);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .ds-blue-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 32px -10px rgba(57, 167, 248, 0.6);
    }
    .ds-blue-card:active {
      transform: scale(0.99);
    }

    /* Thẻ phòng trống tông xanh băng nhẹ để phân biệt trực quan với phòng đang ở */
    .ds-tint-card {
      background: #E8F6FF;
      border-radius: var(--ds-radius-card);
      color: var(--ds-text-main);
      border: 1.5px solid rgba(57, 167, 248, 0.22);
      transition: transform 0.2s ease, background 0.2s ease;
    }
    .ds-tint-card:hover {
      transform: translateY(-2px);
      background: #DFF1FE;
    }

    .ds-icon-box-on-blue {
      background: rgba(255, 255, 255, 0.24);
      border-radius: var(--ds-radius-icon);
    }

    .ds-icon-box-on-tint {
      background: #FFFFFF;
      border-radius: var(--ds-radius-icon);
      box-shadow: 0 4px 12px -4px rgba(57, 167, 248, 0.22);
    }

    .ds-white-card {
      background: var(--ds-surface-white);
      border-radius: var(--ds-radius-card);
      border: 1px solid var(--ds-border-soft);
      box-shadow: 0 8px 24px -12px rgba(22, 43, 64, 0.08);
    }

    /* Thanh tìm kiếm viên thuốc xanh sáng (#75C4FC) giống mẫu */
    .ds-pill-search {
      background: var(--ds-blue-pill);
      color: #FFFFFF;
      border-radius: var(--ds-radius-pill);
      border: none;
      transition: background 0.18s ease, box-shadow 0.18s ease;
    }
    .ds-pill-search::placeholder {
      color: rgba(255, 255, 255, 0.9);
      font-weight: 500;
    }
    .ds-pill-search:focus {
      outline: none;
      background: var(--ds-blue-primary);
      box-shadow: 0 0 0 3px rgba(57, 167, 248, 0.25);
    }

    /* Ô nhập liệu chuẩn sáng rõ, không giãn chữ placeholder */
    .ds-input {
      background: var(--ds-surface-white);
      color: var(--ds-text-main);
      border: 1.5px solid rgba(57, 167, 248, 0.24);
      border-radius: 18px;
      transition: border-color 0.18s ease, box-shadow 0.18s ease;
    }
    .ds-input::placeholder {
      color: #8BA2B8;
      letter-spacing: normal !important;
      font-weight: 500;
    }
    .ds-input:focus {
      outline: none;
      border-color: var(--ds-blue-primary);
      box-shadow: 0 0 0 3px rgba(57, 167, 248, 0.16);
    }

    /* Chip / Tag lọc hình viên thuốc */
    .ds-chip {
      border-radius: var(--ds-radius-pill);
      font-weight: 600;
      transition: all 0.16s ease;
    }
    .ds-chip-active {
      background: var(--ds-blue-primary);
      color: #FFFFFF;
      box-shadow: 0 6px 14px -4px rgba(57, 167, 248, 0.5);
    }
    .ds-chip-inactive {
      background: var(--ds-blue-tint);
      color: #1D85D4;
    }
    .ds-chip-inactive:hover {
      background: #D3ECFF;
    }

    /* Pill Buttons */
    .ds-btn-primary {
      background: linear-gradient(135deg, var(--ds-blue-primary) 0%, var(--ds-blue-bright) 100%);
      color: #FFFFFF;
      border-radius: var(--ds-radius-pill);
      box-shadow: 0 8px 20px -6px rgba(57, 167, 248, 0.55);
      transition: all 0.18s ease;
    }
    .ds-btn-primary:hover { filter: brightness(1.04); }
    .ds-btn-primary:active { transform: scale(0.98); }

    .ds-btn-indigo {
      background: var(--ds-indigo-deep);
      color: #FFFFFF;
      border-radius: var(--ds-radius-pill);
      box-shadow: 0 8px 20px -6px rgba(73, 53, 245, 0.42);
      transition: all 0.18s ease;
    }
    .ds-btn-indigo:hover { filter: brightness(1.06); }
    .ds-btn-indigo:active { transform: scale(0.98); }

    .ds-btn-soft {
      background: var(--ds-blue-tint);
      color: #197BC8;
      border-radius: var(--ds-radius-pill);
      transition: all 0.16s ease;
    }
    .ds-btn-soft:hover { background: #D2ECFF; }

    /* Khung thẻ CCCD chuẩn ISO/IEC 7810 ID-1 (85.6mm x 53.98mm) */
    .cccd-card-slot {
      aspect-ratio: 85.6 / 53.98;
      border-radius: 16px;
      position: relative;
      overflow: hidden;
    }
    .cccd-guide-corners::before {
      content: '';
      position: absolute;
      inset: 10px;
      border: 2px dashed rgba(255, 255, 255, 0.88);
      border-radius: 12px;
      pointer-events: none;
    }

    /* Giao diện hợp đồng chuẩn A4 */
    .contract-paper {
      font-family: 'Times New Roman', Times, serif;
      color: #111827;
      line-height: 1.55;
      font-size: 13.5px;
      background: #FFFFFF;
    }
    .contract-paper:focus {
      outline: 2px solid var(--ds-blue-primary);
      outline-offset: 2px;
    }
    .contract-paper table {
      width: 100%;
      border-collapse: collapse;
      margin: 8px 0 12px 0;
    }
    .contract-paper th,
    .contract-paper td {
      border: 1px solid #374151;
      padding: 5px 8px;
      vertical-align: top;
    }
    .contract-paper .no-border-table td {
      border: none !important;
      padding: 4px 8px;
    }
    .contract-paper h1, .contract-paper h2, .contract-paper h3 {
      margin: 10px 0 6px 0;
    }
    .contract-paper p {
      margin: 4px 0;
      text-align: justify;
    }
    .contract-paper ul {
      margin: 4px 0 8px 20px;
      padding: 0;
    }
    .contract-paper li {
      margin: 2px 0;
      text-align: justify;
    }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(57, 167, 248, 0.32); border-radius: 999px; }

    @media print {
      .no-print { display: none !important; }
      body { background: #FFFFFF !important; }
    }
  </style>

<body>

  <!-- Vùng hiển thị chính -->
  <div id="app"></div>

  <!-- Khung Modal dùng chung -->
  <div id="modal-root" class="fixed inset-0 z-50 hidden items-center justify-center p-3 sm:p-5 bg-[#162B40]/40 backdrop-blur-xs no-print">

  <!-- Toast thông báo (thay thế hoàn toàn alert) -->
  <div id="toast-root" class="fixed top-4 right-4 z-[60] flex flex-col gap-2 max-w-sm w-[calc(100%-2rem)] pointer-events-none no-print"></div>

  <script>
    // =========================================================================
    // 1. CẤU HÌNH HỆ THỐNG, LƯU TRỮ AN TOÀN & BẢO MẬT V3
    // =========================================================================

    // Gắn sẵn URL Web App Google Apps Script để tự động đồng bộ trên mọi thiết bị
    const DEFAULT_SHEET_API_URL = "https://script.google.com/macros/s/AKfycbwbazSbXMFFPOYNKgYCUDF6zIfQqZH-Unx9wovFBb91t7zPp6exE9bJjCdTJcRXYaqp/exec";

    // Mã băm SHA-256 có muối của mật khẩu Chủ nhà (không lưu mật khẩu gốc trong mã nguồn)
    const AUTH_SALT = "SQ19_HANOI_2026_";
    const LANDLORD_HASH = "9da3084e7440bc94a58dc4f188ae59ba3b9ebefefefefd2cab43bdfac04b39e3";

    const VAULT_STORAGE_KEY = "sq19_encrypted_vault_v3";
    const TENANT_VAULT_PREFIX = "sq19_room_vault_v3_";
    const SHEET_URL_STORAGE_KEY = "sq19_sheet_api_url_v3";
    const RATE_LIMIT_PREFIX = "sq19_rl_v3_";
    const GUEST_QUEUE_KEY = "sq19_guest_stay_queue_v3";

    // Bọc localStorage an toàn (chống lỗi SecurityError trong iframe trên Safari/iPhone)
    const memoryStorageFallback = {};
    function safeStorageGet(key) {
      try { return window.localStorage.getItem(key); } catch (_) { return memoryStorageFallback[key] ?? null; }
    }
    function safeStorageSet(key, val) {
      try { window.localStorage.setItem(key, val); } catch (_) { memoryStorageFallback[key] = String(val); }
    }
    function safeStorageRemove(key) {
      try { window.localStorage.removeItem(key); } catch (_) { delete memoryStorageFallback[key]; }
    }

    const ALL_ROOM_IDS = [
      '201','202','203',
      '301','302','303',
      '401','402','403',
      '501','502','503',
      '601','602','603',
      '701','702','703'
    ];
    const DEFAULT_ACTIVE_ROOMS = [
      '201','202','203',
      '301','302','303',
      '401','402','403',
      '501','502','503',
      '601','602','603'
    ];

    const session = {
      role: null,            // null | 'landlord' | 'tenant'
      authStep: 'landing',   // 'landing' | 'landlord-login' | 'tenant-login'
      landlordTab: 'rooms',  // 'rooms' | 'crm' | 'residence' | 'contract' | 'expired' | 'otp'
      viewMode: 'desktop',   // 'desktop' | 'phone' (chuyển đổi khung xem trên máy tính)
      tenantRoomId: null,
      tenantOtp: null,
      tenantRoomData: null,
      tenantList: [],
      tenantGuestStays: [],
      showOtpPlain: false,
      showPwPlain: false,
      adminSecret: null,
      adminApiProof: null,
      syncing: false,
      lastSyncAt: null,
      // Bộ lọc
      roomSearch: '',
      roomStatusFilter: 'ALL',
      crmSearch: '',
      crmRoomFilter: 'ALL',
      crmResFilter: 'ALL',
      selectedContractRoom: '201',
      contractOpts: { pl1: true, pl2: true, pl3: true, ct01: false },
      tempCccd: { front: '', back: '' },
      guestCccd: { front: '', back: '' },
      cameraStream: null,
      cameraFacing: 'environment',
      cameraTarget: null
    };

    let appState = createEmptyState();
    let pendingConfirmCallback = null;

    function createEmptyState() {
      const rooms = {};
      ALL_ROOM_IDS.forEach(id => {
        rooms[id] = {
          id,
          floor: Number(id.charAt(0)),
          active: DEFAULT_ACTIVE_ROOMS.includes(id),
          status: 'vacant',
          startDate: '',
          termMonths: 12,
          endDate: '',
          rent: 5500000,
          deposit: 5500000,
          depositMonths: 1,
          paymentDay: 5,
          vehicles: 1,
          otp: '',
          otpLocked: false,
          notes: ''
        };
      });
      return {
        rooms,
        tenants: [],
        expiredContracts: [],
        guestStays: [],
        contractDrafts: {}
      };
    }

    (function purgeLegacyPlaintextStorage() {
      ['sq19_app_state_v1', 'sq19_app_state_v2', 'sq19_state'].forEach(k => {
        if (safeStorageGet(k)) safeStorageRemove(k);
      });
    })();

    // =========================================================================
    // 2. BĂM SHA-256 THUẦN JS & MÃ HÓA AES-256-GCM + PBKDF2
    // =========================================================================
    function sha256(ascii) {
      function rightRotate(value, amount) {
        return (value >>> amount) | (value << (32 - amount));
      }
      const mathPow = Math.pow;
      const maxWord = mathPow(2, 32);
      const lengthProperty = 'length';
      let i, j;
      let result = '';
      const words = [];
      const utf8 = unescape(encodeURIComponent(ascii));
      const asciiBitLength = utf8[lengthProperty] * 8;
      let hash = sha256.h = sha256.h || [];
      const k = sha256.k = sha256.k || [];
      let primeCounter = k[lengthProperty];
      const isComposite = {};
      for (let candidate = 2; primeCounter < 64; candidate++) {
        if (!isComposite[candidate]) {
          for (i = 0; i < 313; i += candidate) isComposite[i] = candidate;
          hash[primeCounter] = (mathPow(candidate, 0.5) * maxWord) | 0;
          k[primeCounter++] = (mathPow(candidate, 1 / 3) * maxWord) | 0;
        }
      }
      const padded = utf8 + '\x80';
      let paddedFull = padded;
      while ((paddedFull[lengthProperty] % 64) - 56) paddedFull += '\x00';
      for (i = 0; i < paddedFull[lengthProperty]; i++) {
        j = paddedFull.charCodeAt(i);
        words[i >> 2] |= j << ((3 - i) % 4) * 8;
      }
      words[words[lengthProperty]] = ((asciiBitLength / maxWord) | 0);
      words[words[lengthProperty]] = (asciiBitLength);

      const h = hash.slice(0, 8);
      for (j = 0; j < words[lengthProperty];) {
        const w = words.slice(j, j += 16);
        const oldHash = h.slice(0);
        for (i = 0; i < 64; i++) {
          const w15 = w[i - 15], w2 = w[i - 2];
          const a = h[0], e = h[4];
          const temp1 = h[7]
            + (rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25))
            + ((e & h[5]) ^ ((~e) & h[6]))
            + k[i]
            + (w[i] = (i < 16) ? w[i] : (
              w[i - 16]
              + (rightRotate(w15, 7) ^ rightRotate(w15, 18) ^ (w15 >>> 3))
              + w[i - 7]
              + (rightRotate(w2, 17) ^ rightRotate(w2, 19) ^ (w2 >>> 10))
            ) | 0);
          const temp2 = (rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22))
            + ((a & h[1]) ^ (a & h[2]) ^ (h[1] & h[2]));
          h.unshift((temp1 + temp2) | 0);
          h[4] = (h[4] + temp1) | 0;
          h.pop();
        }
        for (i = 0; i < 8; i++) h[i] = (h[i] + oldHash[i]) | 0;
      }
      for (i = 0; i < 8; i++) {
        for (j = 3; j + 1; j--) {
          const b = (h[i] >> (j * 8)) & 255;
          result += ((b < 16) ? 0 : '') + b.toString(16);
        }
      }
      return result;
    }

    function bytesToBase64(bytes) {
      let binary = '';
      for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
      return btoa(binary);
    }
    function base64ToBytes(b64) {
      const binary = atob(b64);
      const out = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) out[i] = binary.charCodeAt(i);
      return out;
    }
    function hexToBytes(hex) {
      const out = new Uint8Array(hex.length / 2);
      for (let i = 0; i < out.length; i++) out[i] = parseInt(hex.substr(i * 2, 2), 16);
      return out;
    }

    async function encryptPayload(plainText, secret) {
      try {
        if (window.crypto && window.crypto.subtle) {
          const enc = new TextEncoder();
          const salt = window.crypto.getRandomValues(new Uint8Array(16));
          const iv = window.crypto.getRandomValues(new Uint8Array(12));
          const keyMat = await window.crypto.subtle.importKey('raw', enc.encode(secret), 'PBKDF2', false, ['deriveKey']);
          const aesKey = await window.crypto.subtle.deriveKey(
            { name: 'PBKDF2', salt, iterations: 120000, hash: 'SHA-256' },
            keyMat,
            { name: 'AES-GCM', length: 256 },
            false,
            ['encrypt']
          );
          const cipherBuf = await window.crypto.subtle.encrypt({ name: 'AES-GCM', iv }, aesKey, enc.encode(plainText));
          return JSON.stringify({
            v: 'aes-gcm-v3',
            s: bytesToBase64(salt),
            i: bytesToBase64(iv),
            c: bytesToBase64(new Uint8Array(cipherBuf))
          });
        }
      } catch (_) {}

      const nonce = Math.random().toString(36).slice(2) + Date.now().toString(36);
      const dataBytes = new TextEncoder().encode(plainText);
      const out = new Uint8Array(dataBytes.length);
      let block = new Uint8Array(0);
      for (let i = 0; i < dataBytes.length; i++) {
        if (i % 32 === 0) block = hexToBytes(sha256(secret + ':' + nonce + ':' + (i >> 5)));
        out[i] = dataBytes[i] ^ block[i % 32];
      }
      const mac = sha256(secret + ':MAC:' + nonce + ':' + bytesToBase64(out));
      return JSON.stringify({ v: 'sha-ctr-v3', n: nonce, c: bytesToBase64(out), m: mac });
    }

    async function decryptPayload(rawJson, secret) {
      if (!rawJson) return null;
      const pkg = JSON.parse(rawJson);
      if (pkg.v === 'aes-gcm-v3' && window.crypto && window.crypto.subtle) {
        const enc = new TextEncoder();
        const salt = base64ToBytes(pkg.s);
        const iv = base64ToBytes(pkg.i);
        const cipher = base64ToBytes(pkg.c);
        const keyMat = await window.crypto.subtle.importKey('raw', enc.encode(secret), 'PBKDF2', false, ['deriveKey']);
        const aesKey = await window.crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt, iterations: 120000, hash: 'SHA-256' },
          keyMat,
          { name: 'AES-GCM', length: 256 },
          false,
          ['decrypt']
        );
        const plainBuf = await window.crypto.subtle.decrypt({ name: 'AES-GCM', iv }, aesKey, cipher);
        return new TextDecoder().decode(plainBuf);
      }
      if (pkg.v === 'sha-ctr-v3') {
        const expectedMac = sha256(secret + ':MAC:' + pkg.n + ':' + pkg.c);
        if (expectedMac !== pkg.m) throw new Error('Invalid key');
        const cipher = base64ToBytes(pkg.c);
        const out = new Uint8Array(cipher.length);
        let block = new Uint8Array(0);
        for (let i = 0; i < cipher.length; i++) {
          if (i % 32 === 0) block = hexToBytes(sha256(secret + ':' + pkg.n + ':' + (i >> 5)));
          out[i] = cipher[i] ^ block[i % 32];
        }
        return new TextDecoder().decode(out);
      }
      throw new Error('Unsupported vault format');
    }

    async function saveEncryptedVault() {
      if (!session.adminSecret) return;
      try {
        const cipher = await encryptPayload(JSON.stringify(appState), session.adminSecret);
        safeStorageSet(VAULT_STORAGE_KEY, cipher);
        await syncOfflineTenantVaults();
      } catch (err) {
        console.error('Lỗi mã hóa kho dữ liệu:', err);
      }
    }

    async function loadEncryptedVault(secret) {
      const raw = safeStorageGet(VAULT_STORAGE_KEY);
      if (!raw) {
        appState = createEmptyState();
        return;
      }
      const plain = await decryptPayload(raw, secret);
      const parsed = JSON.parse(plain);
      const base = createEmptyState();
      if (parsed && parsed.rooms) {
        ALL_ROOM_IDS.forEach(id => {
          if (parsed.rooms[id]) base.rooms[id] = Object.assign(base.rooms[id], parsed.rooms[id]);
        });
      }
      base.tenants = Array.isArray(parsed.tenants) ? parsed.tenants : [];
      base.expiredContracts = Array.isArray(parsed.expiredContracts) ? parsed.expiredContracts : [];
      base.guestStays = Array.isArray(parsed.guestStays) ? parsed.guestStays : [];
      base.contractDrafts = parsed.contractDrafts || {};
      appState = base;
      mergeOfflineGuestQueueIntoAppState();
    }

    function mergeOfflineGuestQueueIntoAppState() {
      try {
        const raw = safeStorageGet(GUEST_QUEUE_KEY);
        if (!raw) return;
        const queued = JSON.parse(raw);
        if (!Array.isArray(queued) || !queued.length) return;
        const existingIds = new Set((appState.guestStays || []).map(x => x.id));
        let added = 0;
        queued.forEach(item => {
          if (item && item.id && !existingIds.has(item.id)) {
            appState.guestStays.unshift(item);
            added++;
          }
        });
        if (added > 0) saveEncryptedVault();
      } catch (_) {}
    }

    async function syncOfflineTenantVaults() {
      try {
        for (const id of ALL_ROOM_IDS) {
          const room = appState.rooms[id];
          const key = TENANT_VAULT_PREFIX + id;
          if (!room || !room.active || !room.otp || room.otpLocked) {
            safeStorageRemove(key);
            continue;
          }
          const safeRoom = Object.assign({}, room, { otp: '' });
          const tenants = getRoomTenants(id);
          const otpHash = sha256('SQ19_OTP_V3_' + id + '_' + room.otp);
          const payload = await encryptPayload(JSON.stringify({ room: safeRoom, tenants }), 'OTP_' + id + '_' + room.otp);
          safeStorageSet(key, JSON.stringify({ h: otpHash, p: payload }));
        }
      } catch (_) {}
    }

    function checkRateLimit(bucket) {
      try {
        const raw = safeStorageGet(RATE_LIMIT_PREFIX + bucket);
        if (!raw) return { blocked: false, waitSec: 0 };
        const obj = JSON.parse(raw);
        if (obj.until && Date.now() < obj.until) {
          return { blocked: true, waitSec: Math.ceil((obj.until - Date.now()) / 1000) };
        }
      } catch (_) {}
      return { blocked: false, waitSec: 0 };
    }
    function recordFailedAttempt(bucket) {
      try {
        const raw = safeStorageGet(RATE_LIMIT_PREFIX + bucket);
        const obj = raw ? JSON.parse(raw) : { count: 0, until: 0 };
        if (obj.until && Date.now() >= obj.until) obj.count = 0;
        obj.count += 1;
        if (obj.count >= 5) {
          obj.until = Date.now() + 60000;
          obj.count = 0;
        }
        safeStorageSet(RATE_LIMIT_PREFIX + bucket, JSON.stringify(obj));
        return obj.until > Date.now() ? 60 : 0;
      } catch (_) { return 0; }
    }
    function clearRateLimit(bucket) {
      safeStorageRemove(RATE_LIMIT_PREFIX + bucket);
    }

    // =========================================================================
    // 3. KẾT NỐI GOOGLE SHEET API (HỖ TRỢ CHẠY TRỰC TIẾP TRONG APPS SCRIPT)
    // =========================================================================
    function isRunningInAppsScript() {
      return typeof google !== 'undefined' && google.script && google.script.run;
    }
    function getSheetApiUrl() {
      const saved = (safeStorageGet(SHEET_URL_STORAGE_KEY) || '').trim();
      return saved || DEFAULT_SHEET_API_URL.trim();
    }
    function isSheetConnected() {
      return isRunningInAppsScript() || Boolean(getSheetApiUrl());
    }

    async function callSheetApi(payload) {
      if (isRunningInAppsScript()) {
        return new Promise((resolve, reject) => {
          google.script.run
            .withSuccessHandler((resStr) => {
              try {
                const data = typeof resStr === 'string' ? JSON.parse(resStr) : resStr;
                if (!data || !data.ok) reject(new Error((data && data.error) || 'Lỗi từ Google Apps Script'));
                else resolve(data);
              } catch (_) {
                reject(new Error('Phản hồi từ Google Apps Script không hợp lệ.'));
              }
            })
            .withFailureHandler((err) => reject(new Error((err && err.message) || String(err))))
            .apiDispatch(JSON.stringify(payload));
        });
      }
      const url = getSheetApiUrl();
      if (!url) throw new Error('Chưa cấu hình URL Google Sheet Web App.');
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      const text = await res.text();
      let data;
      try { data = JSON.parse(text); } catch (_) {
        throw new Error('Phản hồi từ Google Apps Script không hợp lệ. Kiểm tra lại quyền "Bất kỳ ai".');
      }
      if (!data.ok) throw new Error(data.error || 'Lỗi từ Google Apps Script');
      return data;
    }

    async function syncFromSheet(silent = false) {
      if (!isSheetConnected() || !session.adminApiProof) return false;
      session.syncing = true;
      render();
      try {
        const res = await callSheetApi({ action: 'getData', proof: session.adminApiProof });
        if (res.rooms) {
          ALL_ROOM_IDS.forEach(id => {
            if (res.rooms[id]) appState.rooms[id] = Object.assign(appState.rooms[id], res.rooms[id]);
          });
        }
        const activeTenants = [];
        const extraExpired = [];
        if (Array.isArray(res.tenants)) {
          res.tenants.forEach(t => {
            if (isExpiredContractText(t.contractStatus)) {
              extraExpired.push({
                id: 'CLIENT_EXP_' + (t.id || Date.now()),
                source: 'sheet',
                roomId: t.room || '',
                tenantNames: t.fullName || '(Chưa rõ tên)',
                cccds: t.cccd || '',
                phones: t.phone || '',
                startDate: t.sheetStartDate || '',
                endDate: t.sheetEndDate || '',
                moveOutDate: t.sheetEndDate || '',
                depositStatus: 'Hết hiệu lực (Cột N)',
                notes: 'Phân loại từ Cột N trên Google Sheet'
              });
              return;
            }
            activeTenants.push(t);
            if (t.room && appState.rooms[t.room]) {
              const r = appState.rooms[t.room];
              r.active = true;
              if (r.status === 'vacant') r.status = 'active';
              if (!r.otp && t.sheetOtp) { r.otp = t.sheetOtp; r.otpLocked = false; }
              if (!r.startDate && t.sheetStartDate) r.startDate = t.sheetStartDate;
              if (!r.endDate && t.sheetEndDate) r.endDate = t.sheetEndDate;
            }
          });
        }
        appState.tenants = activeTenants;

        const serverExpired = Array.isArray(res.expiredContracts) ? res.expiredContracts : [];
        const seenExp = new Set(serverExpired.map(x => String(x.id)));
        appState.expiredContracts = serverExpired.concat(extraExpired.filter(x => !seenExp.has(String(x.id))));

        if (Array.isArray(res.guestStays)) appState.guestStays = res.guestStays;
        mergeOfflineGuestQueueIntoAppState();
        session.lastSyncAt = new Date().toLocaleTimeString('vi-VN');
        await saveEncryptedVault();
        if (!silent) {
          const count = appState.tenants.length;
          const expCount = (appState.expiredContracts || []).length;
          const sheetInfo = res.meta && res.meta.sheetName ? ` từ sheet "${res.meta.sheetName}"` : '';
          if (count > 0 || expCount > 0) {
            showToast(`Đã đồng bộ ${count} khách đang thuê và ${expCount} HĐ hết hiệu lực${sheetInfo}!`, 'success');
          } else {
            showToast(`Kết nối thành công${sheetInfo} nhưng chưa thấy hồ sơ nào.`, 'warning');
          }
        }
        return true;
      } catch (err) {
        if (!silent) showToast('Không thể đồng bộ Google Sheet: ' + err.message, 'error');
        return false;
      } finally {
        session.syncing = false;
        render();
      }
    }

    function escapeHtml(str) {
      return String(str == null ? '' : str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');

      const root = document.getElementById('toast-root');

      const styles = {

        error: 'bg-rose-500 text-white border-rose-400',
        warning: 'bg-amber-500 text-white border-amber-400',
        info: 'bg-[#39A7F8] text-white border-[#50B3F9]'

      const el = document.createElement('div');
      el.className = `pointer-events-auto px-4 py-3 rounded-2xl shadow-lg border text-xs sm:text-sm font-semibold transition-all duration-300 ${styles[type] || styles.info}`;

    function copyTextSafe(text, successMsg = 'Đã sao chép!') {
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast(successMsg, 'success');
      } catch (_) {
        showToast('Không thể tự động sao chép, vui lòng bôi đen copy thủ công.', 'warning');

    function getActiveRoomIds() {
      return ALL_ROOM_IDS.filter(id => appState.rooms[id] && appState.rooms[id].active);

    function isExpiredContractText(val) {
      const s = String(val || '')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/đ/g, 'd').replace(/Đ/g, 'D')
        .toLowerCase().trim();
      return s.includes('het hieu luc');
    }

    function getRoomTenants(roomId) {
      const order = { 'Đại diện': 0, 'Ở cùng': 1, 'Bảo trợ': 2 };
      return (appState.tenants || [])
        .filter(t => {
          if (isExpiredContractText(t.contractStatus)) return false;
          return String(t.room) === String(roomId);
        })
        .sort((a, b) => (order[a.roleInRoom] ?? 9) - (order[b.roleInRoom] ?? 9));
    }

    function formatDateVN(isoDate) {
      if (!isoDate) return '—';
      const s = String(isoDate).trim();
      const m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
      if (m) return `${m[3]}/${m[2]}/${m[1]}`;
      return s;
    }

    function addMonthsToDate(isoDate, months) {
      if (!isoDate) return '';
      const d = new Date(isoDate + 'T00:00:00');
      if (isNaN(d.getTime())) return '';
      d.setMonth(d.getMonth() + Number(months || 0));
      return d.toISOString().slice(0, 10);
    }

    function daysUntil(isoDate) {
      if (!isoDate) return null;
      const target = new Date(String(isoDate).slice(0, 10) + 'T00:00:00');
      if (isNaN(target.getTime())) return null;
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      return Math.round((target.getTime() - today.getTime()) / 86400000);
    }

    function formatVND(amount) {
      const n = Number(amount || 0);
      return n ? n.toLocaleString('vi-VN') + ' VNĐ' : '0 VNĐ';
    }

    function numberToVietnameseWords(num) {
      const n = Math.round(Number(num) || 0);
      if (n <= 0) return 'Không đồng';
      const units = ['', 'nghìn', 'triệu', 'tỷ'];
      const digits = ['không', 'một', 'hai', 'ba', 'bốn', 'năm', 'sáu', 'bảy', 'tám', 'chín'];
      const readTriple = (val, full) => {
        const h = Math.floor(val / 100);
        const t = Math.floor((val % 100) / 10);
        const u = val % 10;
        let out = '';
        if (h > 0 || full) out += digits[h] + ' trăm ';
        if (t > 1) {
          out += digits[t] + ' mươi ';
          if (u === 1) out += 'mốt ';
          else if (u === 5) out += 'lăm ';
          else if (u > 0) out += digits[u] + ' ';
        } else if (t === 1) {
          out += 'mười ';
          if (u === 5) out += 'lăm ';
          else if (u > 0) out += digits[u] + ' ';
        } else if (u > 0) {
          if (h > 0 || full) out += 'linh ';
          out += digits[u] + ' ';
        }
        return out.trim();
      };
      const parts = [];
      let rem = n;
      let idx = 0;
      while (rem > 0 && idx < units.length) {
        const grp = rem % 1000;
        if (grp > 0) {
          const full = rem >= 1000;
          parts.unshift((readTriple(grp, full) + (units[idx] ? ' ' + units[idx] : '')).trim());
        }
        rem = Math.floor(rem / 1000);
        idx++;
      }
      const res = parts.join(' ').trim() + ' đồng chẵn';
      return res.charAt(0).toUpperCase() + res.slice(1);
    }

    function getRoomStatusInfo(room) {
      if (!room || room.status === 'vacant') {
        return {
          key: 'vacant',
          label: 'Phòng trống',
          isVacant: true,
          badgeCls: 'bg-[#39A7F8]/15 text-[#197BC8]'
        };
      }
      const d = daysUntil(room.endDate);
      if (room.status === 'expired' || (d !== null && d < 0)) {
        return {
          key: 'expired',
          label: d !== null && d < 0 ? `Quá hạn ${Math.abs(d)}n` : 'Hết hạn HĐ',
          isVacant: false,
          badgeCls: 'bg-rose-500 text-white'
        };
      }
      if (d !== null && d <= 30) {
        return {
          key: 'expiring',
          label: `Còn ${d} ngày`,
          isVacant: false,
          badgeCls: 'bg-amber-400 text-slate-950'
        };
      }
      if (room.status === 'extended') {
        return {
          key: 'extended',
          label: 'Gia hạn thêm',
          isVacant: false,
          badgeCls: 'bg-[#4935F5] text-white'
        };
      }
      return {
        key: 'active',
        label: d !== null ? `Còn ${d} ngày` : 'Đang thuê',
        isVacant: false,
        badgeCls: 'bg-white/25 text-white'
      };
    }

    function getResidenceBadge(tenant) {
      const st = String(tenant?.residenceStatus || 'Chưa khai báo').trim();
      const norm = st.toLowerCase();
      const d = daysUntil(tenant?.residenceExpiry);
      if (norm.includes('hết hạn') || norm.includes('hết hiệu lực') || norm.includes('het han') || norm.includes('het hieu luc')) {
        return { label: 'Hết hiệu lực', cls: 'bg-rose-500 text-white', valid: false };
      }
      if (norm.includes('còn hiệu lực') || norm.includes('đã đăng ký') || norm.includes('con hieu luc') || norm.includes('da dang ky')) {
        if (d !== null && d < 0) return { label: 'Hết hiệu lực', cls: 'bg-rose-500 text-white', valid: false };
        if (d !== null && d <= 15) return { label: `Sắp hết (${d}n)`, cls: 'bg-amber-400 text-slate-950', valid: true };
        return { label: 'Còn hiệu lực', cls: 'bg-emerald-500 text-white', valid: true };
      }
      if (norm.includes('đang xử lý') || norm.includes('dang xu ly')) return { label: 'Đang xử lý', cls: 'bg-[#E3F4FF] text-[#197BC8]', valid: false };
      return { label: 'Chưa khai báo', cls: 'bg-rose-500/90 text-white', valid: false };
    }

    function renderAuth() {

      const content = `

    async function handleLandlordLogin(e) {
      e.preventDefault();
      const rl = checkRateLimit('landlord');
      if (rl.blocked) {
        showToast(`Bạn đã nhập sai quá 5 lần. Vui lòng thử lại sau ${rl.waitSec} giây.`, 'error');
        return;
      }
      const pw = (document.getElementById('landlord-pw-input')?.value || '').trim();
      const hashed = sha256(AUTH_SALT + pw);
      if (hashed !== LANDLORD_HASH) {
        const locked = recordFailedAttempt('landlord');
        showToast(locked ? 'Nhập sai quá 5 lần! Tạm khóa đăng nhập 60 giây.' : 'Mật khẩu Chủ nhà không chính xác.', 'error');
        return;
      }
      clearRateLimit('landlord');
      session.role = 'landlord';
      session.adminSecret = pw;
      session.adminApiProof = sha256('SQ19_API_PROOF_V3_' + pw);
      try {
        await loadEncryptedVault(pw);
      } catch (_) {
        appState = createEmptyState();
      }
      render();
      showToast('Đăng nhập Chủ nhà thành công!', 'success');
      if (isSheetConnected()) {
        syncFromSheet(false);
      }
    }

    async function handleTenantLogin(e) {
      e.preventDefault();
      const rl = checkRateLimit('tenant');
      if (rl.blocked) {
        showToast(`Nhập sai OTP quá 5 lần. Vui lòng chờ ${rl.waitSec} giây.`, 'error');
        return;
      }
      const otp = (document.getElementById('tenant-otp-input')?.value || '').trim();
      if (!otp) return;

      const btn = document.getElementById('tenant-login-btn');
      if (btn) { btn.disabled = true; btn.innerHTML = '<span>Đang xác thực OTP...</span>'; }

      try {
        if (isSheetConnected()) {
          const res = await callSheetApi({ action: 'verifyOtp', otp });
          clearRateLimit('tenant');
          session.role = 'tenant';
          session.tenantOtp = otp;
          session.tenantRoomId = res.room.id;
          session.tenantRoomData = res.room;
          session.tenantList = Array.isArray(res.tenants) ? res.tenants : [];
          session.tenantGuestStays = Array.isArray(res.guestStays) ? res.guestStays : [];
          render();
          showToast(`Chào mừng cư dân Phòng ${res.room.id}!`, 'success');
          return;
        }

        for (const id of ALL_ROOM_IDS) {
          const raw = safeStorageGet(TENANT_VAULT_PREFIX + id);
          if (!raw) continue;
          const pkg = JSON.parse(raw);
          const expectedHash = sha256('SQ19_OTP_V3_' + id + '_' + otp);
          if (pkg.h === expectedHash) {
            const plain = await decryptPayload(pkg.p, 'OTP_' + id + '_' + otp);
            const data = JSON.parse(plain);
            clearRateLimit('tenant');
            session.role = 'tenant';
            session.tenantOtp = otp;
            session.tenantRoomId = id;
            session.tenantRoomData = data.room;
            session.tenantList = Array.isArray(data.tenants) ? data.tenants : [];
            const queued = JSON.parse(safeStorageGet(GUEST_QUEUE_KEY) || '[]');
            session.tenantGuestStays = queued.filter(g => String(g.roomId) === String(id));
            render();
            showToast(`Chào mừng cư dân Phòng ${id}!`, 'success');
            return;
          }
        }
        throw new Error('Mã OTP không đúng hoặc phòng đang bị khóa.');
      } catch (err) {
        const locked = recordFailedAttempt('tenant');
        showToast(locked ? 'Nhập sai quá 5 lần! Tạm khóa 60 giây.' : (err.message || 'Mã OTP không chính xác.'), 'error');
      } finally {
        if (btn) { btn.disabled = false; btn.innerHTML = '<span>Truy cập thông tin phòng</span>'; }
      }
    }

      stopCameraStream();
      session.role = null;
      session.authStep = 'landing';

      session.adminApiProof = null;

    function renderRoomsTab() {
      const activeIds = getActiveRoomIds();
      const isPhone = session.viewMode === 'phone';
      let cActive = 0, cExpiring = 0, cExpired = 0, cVacant = 0;
      activeIds.forEach(id => {
        const st = getRoomStatusInfo(appState.rooms[id]).key;
        if (st === 'vacant') cVacant++;
        else if (st === 'expired') cExpired++;
        else if (st === 'expiring') cExpiring++;
        else cActive++;
      });

      const q = (session.roomSearch || '').toLowerCase().trim();
      const visibleIds = activeIds.filter(id => {
        const room = appState.rooms[id];
        const st = getRoomStatusInfo(room).key;
        if (session.roomStatusFilter !== 'ALL') {
          if (session.roomStatusFilter === 'ACTIVE' && st !== 'active' && st !== 'extended') return false;
          if (session.roomStatusFilter === 'EXPIRING' && st !== 'expiring') return false;
          if (session.roomStatusFilter === 'EXPIRED' && st !== 'expired') return false;
          if (session.roomStatusFilter === 'VACANT' && st !== 'vacant') return false;
        }
        if (!q) return true;
        const names = getRoomTenants(id).map(t => t.fullName + ' ' + t.phone).join(' ');
        return (`phòng ${id} ${names}`).toLowerCase().includes(q);
      });

      const chips = [

    function autoCalcRoomEnd() {
      const s = document.getElementById('rm-start')?.value;
      const t = Number(document.getElementById('rm-term')?.value || 12);
      const eEl = document.getElementById('rm-end');
      if (s && eEl) eEl.value = addMonthsToDate(s, t);

    function quickExtendRoom(roomId, addMonths) {
      const endEl = document.getElementById('rm-end');
      const statusEl = document.getElementById('rm-status');
      const base = (endEl && endEl.value) ? endEl.value : new Date().toISOString().slice(0, 10);
      if (endEl) endEl.value = addMonthsToDate(base, addMonths);
      if (statusEl) statusEl.value = 'extended';
      showToast(`Đã cộng thêm ${addMonths} tháng. Bấm "Lưu thông tin" để xác nhận.`, 'info');
    }

      r.startDate = document.getElementById('rm-start').value;

    async function confirmArchiveContract(roomId) {
      const r = appState.rooms[roomId];
      const tenants = getRoomTenants(roomId);
      const record = {
        id: 'EXP_' + Date.now(),
        roomId,
        tenantNames: tenants.map(t => t.fullName).join(', ') || 'Không rõ',
        cccds: tenants.map(t => t.cccd).filter(Boolean).join(', '),
        phones: tenants.map(t => t.phone).filter(Boolean).join(', '),
        startDate: r.startDate || '',
        endDate: r.endDate || '',
        moveOutDate: document.getElementById('arc-moveout').value || new Date().toISOString().slice(0, 10),
        depositStatus: document.getElementById('arc-deposit').value,
        notes: (document.getElementById('arc-notes').value || '').trim()
      };
      appState.expiredContracts.unshift(record);
      appState.tenants.forEach(t => {
        if (String(t.room) === String(roomId)) {
          t.room = '';
          t.tenantStatus = 'Đã rời đi';
          t.contractStatus = 'Hết hiệu lực';
        }
      });
      r.status = 'vacant';
      r.startDate = '';
      r.endDate = '';
      r.otp = '';
      r.otpLocked = true;

      await saveEncryptedVault();
      await pushActionToSheet('archiveContract', { record, room: r });
      closeModal();
      render();
      showToast(`Đã chuyển Phòng ${roomId} sang HĐ Hết hiệu lực và giải phóng phòng trống.`, 'success');
    }

    async function saveTenantForm(existingId) {
      const fullName = (document.getElementById('tf-name').value || '').trim();
      if (!fullName) { showToast('Vui lòng nhập Họ và tên khách thuê.', 'warning'); return; }
      const existingTenant = existingId ? appState.tenants.find(x => String(x.id) === String(existingId)) : null;
      const obj = {
        id: existingId || ('T_' + Date.now()),
        fullName,
        cccd: (document.getElementById('tf-cccd').value || '').trim(),
        dob: document.getElementById('tf-dob').value,
        gender: document.getElementById('tf-gender').value,
        cccdDate: document.getElementById('tf-cccdDate').value,
        cccdPlace: 'Cục Cảnh sát QLHC về TTXH',
        phone: (document.getElementById('tf-phone').value || '').trim(),
        room: document.getElementById('tf-room').value,
        roleInRoom: document.getElementById('tf-role').value,
        address: (document.getElementById('tf-address').value || '').trim(),
        job: (document.getElementById('tf-job').value || '').trim(),
        contractStatus: existingTenant?.contractStatus || 'Còn hiệu lực',
        residenceStatus: document.getElementById('tf-resStatus').value,
        residenceExpiry: document.getElementById('tf-resExp').value,
        cccdFront: session.tempCccd.front || '',
        cccdBack: session.tempCccd.back || ''
      };

      const idx = appState.tenants.findIndex(x => String(x.id) === String(obj.id));
      if (idx >= 0) appState.tenants[idx] = obj;
      else appState.tenants.push(obj);

      if (obj.room && appState.rooms[obj.room]) {
        appState.rooms[obj.room].active = true;
        if (appState.rooms[obj.room].status === 'vacant') appState.rooms[obj.room].status = 'active';
      }

      await saveEncryptedVault();
      await pushActionToSheet('saveTenant', { tenant: obj });
      closeModal();
      render();
      showToast('Đã lưu hồ sơ khách thuê!', 'success');
    }

    function importTenantsCsv(e) {
      const file = e.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async () => {
        try {
          const text = String(reader.result || '').replace(/^\uFEFF/, '');
          const rows = parseCsvText(text);
          if (rows.length < 2) { showToast('File CSV không có dữ liệu.', 'warning'); return; }
          let added = 0;
          for (let i = 1; i < rows.length; i++) {
            const r = rows[i];
            const fullName = (r[3] || '').trim();
            if (!fullName) continue;
            let cccd = (r[1] || '').replace(/[^0-9]/g, '');
            if (cccd && cccd.length >= 9 && cccd.length < 12) cccd = cccd.padStart(12, '0');
            let phone = (r[10] || '').replace(/[^0-9]/g, '');
            if (phone && phone.length === 9 && !phone.startsWith('0')) phone = '0' + phone;
            const roomMatch = String(r[8] || '').match(/([2-7]0[1-3])/);
            appState.tenants.push({
              id: 'CSV_' + Date.now() + '_' + i,
              cccd, fullName,
              gender: (r[4] || '').trim(),
              dob: (r[5] || '').trim(),
              address: (r[6] || '').trim(),
              cccdDate: (r[7] || '').trim(),
              cccdPlace: 'Cục Cảnh sát QLHC về TTXH',
              room: roomMatch ? roomMatch[1] : '',
              phone,
              roleInRoom: 'Đại diện',
              job: (r[17] || '').trim(),
              residenceStatus: 'Chưa khai báo',
              residenceExpiry: ''
            });
            added++;
          }
          await saveEncryptedVault();
          render();
          showToast(`Đã nhập thành công ${added} hồ sơ từ CSV!`, 'success');
        } catch (err) {
          showToast('Lỗi đọc file CSV: ' + err.message, 'error');
        }
      };
      reader.readAsText(file, 'utf-8');
      e.target.value = '';
    }

    function parseCsvText(str) {
      const arr = [];
      let quote = false, row = [''], col = 0;
      for (let i = 0; i < str.length; i++) {
        const c = str[i], next = str[i + 1];
        if (c === '"' && quote && next === '"') { row[col] += '"'; i++; }
        else if (c === '"') { quote = !quote; }
        else if (c === ',' && !quote) { row[++col] = ''; }
        else if ((c === '\r' && next === '\n' || c === '\n' || c === '\r') && !quote) {
          if (c === '\r' && next === '\n') i++;
          arr.push(row); row = ['']; col = 0;
        } else { row[col] += c; }
      }
      if (row.some(x => x)) arr.push(row);
      return arr;
    }

    function exportTenantsCsv() {
      const headers = ['STT','Số CCCD','Họ và tên','Giới tính','Ngày sinh','Nơi thường trú','Ngày cấp CCCD','Phòng thuê','OTP','Số điện thoại','Vai trò','Nghề nghiệp','Trạng thái tạm trú','Hạn tạm trú'];
      const lines = [headers.join(',')];
      appState.tenants.forEach((t, idx) => {
        const otp = t.room && appState.rooms[t.room] ? appState.rooms[t.room].otp : '';
        const vals = [idx + 1, t.cccd, t.fullName, t.gender, t.dob, t.address, t.cccdDate, t.room, otp, t.phone, t.roleInRoom, t.job, t.residenceStatus, t.residenceExpiry];
        lines.push(vals.map(v => `"${String(v || '').replace(/"/g, '""')}"`).join(','));
      });
      const blob = new Blob(['\uFEFF' + lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `CRM_19_San_Quan_${new Date().toISOString().slice(0, 10)}.csv`;
      a.click();
    }

    function genRandomOtp(roomId) {
      let code = '';
      const used = new Set(ALL_ROOM_IDS.filter(x => x !== roomId).map(x => appState.rooms[x]?.otp).filter(Boolean));
      for (let i = 0; i < 30; i++) {
        code = String(Math.floor(100000 + Math.random() * 900000));
        if (!used.has(code)) break;
      }
      const el = document.getElementById('otp-val-' + roomId);
      if (el) el.value = code;
    }

    async function saveRoomOtp(roomId) {
      const val = (document.getElementById('otp-val-' + roomId)?.value || '').trim();
      if (val) {
        const dup = ALL_ROOM_IDS.find(id => id !== roomId && appState.rooms[id]?.otp === val);
        if (dup) {
          showToast(`Mã OTP "${val}" đang trùng với Phòng ${dup}! Vui lòng chọn mã duy nhất.`, 'error');
          return;
        }
      }
      appState.rooms[roomId].otp = val;
      appState.rooms[roomId].otpLocked = false;
      await saveEncryptedVault();
      await pushActionToSheet('updateOtp', { roomId, otp: val, locked: false });
      render();
      showToast(`Đã lưu OTP Phòng ${roomId} và đồng bộ lên Cột J Google Sheet!`, 'success');
    }

    async function toggleLockOtp(roomId) {
      const r = appState.rooms[roomId];
      r.otpLocked = !r.otpLocked;
      await saveEncryptedVault();
      await pushActionToSheet('updateOtp', { roomId, otp: r.otp || '', locked: r.otpLocked });
      render();
      showToast(r.otpLocked ? `Đã khóa OTP Phòng ${roomId}.` : `Đã mở khóa OTP Phòng ${roomId}.`, 'info');
    }

    function copyZaloOtp(roomId) {
      const otp = appState.rooms[roomId]?.otp;
      if (!otp) { showToast('Phòng này chưa có mã OTP.', 'warning'); return; }
      const msg = `Chào bạn, Ban quản lý tòa nhà 19 Sân Quần gửi bạn mã OTP đăng nhập Cổng Khách thuê Phòng ${roomId}: ${otp}\n(Chỉ cần chọn "Tôi là Khách thuê" và nhập mã OTP này để xem hạn hợp đồng, tạm trú & khai báo người thân lưu trú).`;
      copyTextSafe(msg, `Đã copy tin nhắn OTP Phòng ${roomId} để gửi Zalo!`);
    }

                      <div class="text-[#627D98]">${escapeHtml(t.roleInRoom || 'Cư dân')} · ${escapeHtml(t.phone || '—')}</div>

                    </div>

                }).join('') : `<div class="text-xs text-[#627D98]">Chưa có danh sách thành viên.</div>`}

              <div class="p-3.5 rounded-2xl bg-[#E3F4FF]/80 text-xs text-[#162B40] space-y-1">

                <div>• <strong>30 ngày:</strong> Bắt buộc đăng ký tạm trú nếu sinh sống từ 30 ngày trở lên.</div>

              </div>
            </div>

            <!-- Khai báo Người thân / Bạn bè lưu trú + Chụp CCCD 2 mặt -->

              </div>
              <form onsubmit="submitTenantGuestStay(event)" class="space-y-3 text-xs">
                <div class="grid grid-cols-1 ${isPhone ? '' : 'sm:grid-cols-2'} gap-2.5">

                    <option value="2 - 3 đêm">2 - 3 đêm</option>
                    <option value="1 tuần">1 tuần</option>
                    <option value="2 tuần">2 tuần</option>
                    <option value="1 tháng">1 tháng</option>
                    <option value="2 tháng">2 tháng</option>
                    <option value="3 tháng trở lên">3 tháng trở lên</option>

                  <input id="gs-notes" type="text" placeholder="Ghi chú (biển số xe nếu có)" class="ds-input w-full px-3.5 py-2.5 font-semibold" />
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-1">
                  ${['front', 'back'].map(side => `
                    <div class="space-y-1.5">
                      <div class="font-bold text-[#162B40]">${side === 'front' ? 'CCCD Mặt trước *' : 'CCCD Mặt sau *'}</div>
                      <div id="guest-cccd-preview-${side}" class="cccd-card-slot bg-[#F5FCFF] border-2 border-dashed border-[#39A7F8]/40 flex items-center justify-center">
                        ${renderCccdSlotInner(session.guestCccd[side], side)}
                      </div>
                      <div class="flex gap-2">
                        <button type="button" onclick="openCameraModal('guest', '${side}')" class="flex-1 py-2 ds-btn-primary font-bold flex items-center justify-center gap-1">

                        </button>
                        <label class="flex-1 cursor-pointer py-2 ds-btn-soft font-bold flex items-center justify-center gap-1">
                          <i data-lucide="upload" class="w-3.5 h-3.5"></i> Chọn ảnh

                <button type="submit" id="gs-submit-btn" class="ds-btn-primary w-full py-3.5 font-extrabold text-sm">

              </form>

              ${stays.length ? `
                <div class="pt-3 border-t border-[#39A7F8]/15 space-y-2">
                  <div class="text-xs font-extrabold text-[#162B40]">Lịch sử khai báo của Phòng ${escapeHtml(session.tenantRoomId)}</div>
                  ${stays.map(g => `
                    <div class="p-3 rounded-2xl bg-[#F5FCFF] border border-[#39A7F8]/15 flex items-center justify-between text-xs">
                      <div>
                        <span class="font-bold text-[#162B40]">${escapeHtml(g.guestName)}</span>
                        <span class="text-[#627D98]"> · ${escapeHtml(g.duration)}</span>
                      </div>
                      <span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold ${g.status === 'Đã xác nhận' ? 'bg-emerald-500 text-white' : 'bg-amber-400 text-slate-950'}">${escapeHtml(g.status)}</span>

            <!-- Biểu phí & Chuyển khoản -->
            <div class="ds-white-card p-5 space-y-2.5 text-xs">
              <div class="text-base font-extrabold text-[#162B40]">Biểu phí & Chuyển khoản</div>
              <div class="text-[#627D98]">• Điện: <strong class="text-[#162B40]">4.000đ/kWh</strong> · Nước: <strong class="text-[#162B40]">150k/người</strong> · Net: <strong class="text-[#162B40]">100k</strong> · DV: <strong class="text-[#162B40]">200k/người</strong></div>
              <div class="grid grid-cols-1 ${isPhone ? '' : 'sm:grid-cols-2'} gap-2">
                <button type="button" onclick="copyTextSafe('000474609999', 'Đã copy STK LPBank Vũ Duy An!')" class="text-left p-3 rounded-2xl bg-[#F5FCFF] hover:bg-[#E3F4FF] border border-[#39A7F8]/20 transition">
                  <div class="font-bold text-[#162B40]">Vũ Duy An · LPBank</div>
                  <div class="font-mono font-extrabold text-[#4935F5] text-sm mt-0.5">000474609999</div>
                </button>
                <button type="button" onclick="copyTextSafe('03101014025588', 'Đã copy STK MSB Nguyễn Văn Sơn!')" class="text-left p-3 rounded-2xl bg-[#F5FCFF] hover:bg-[#E3F4FF] border border-[#39A7F8]/20 transition">
                  <div class="font-bold text-[#162B40]">Nguyễn Văn Sơn · MSB</div>
                  <div class="font-mono font-extrabold text-[#4935F5] text-sm mt-0.5">03101014025588</div>
                </button>
              </div>
            </div>
          </main>
        </div>
      `;
      return wrapInResponsiveShell(inner);
    }

    async function submitTenantGuestStay(e) {
      e.preventDefault();
      if (!session.guestCccd.front || !session.guestCccd.back) {
        showToast('Vui lòng chụp hoặc tải đủ 2 mặt ảnh CCCD của người lưu trú.', 'warning');
        return;
      }
      const btn = document.getElementById('gs-submit-btn');
      if (btn) { btn.disabled = true; btn.textContent = 'Đang gửi ảnh lên hệ thống...'; }
      const record = {
        id: 'GS_' + Date.now(),
        roomId: session.tenantRoomId,
        guestName: (document.getElementById('gs-name').value || '').trim(),
        relation: (document.getElementById('gs-rel').value || '').trim() || 'Người thân',
        guestPhone: (document.getElementById('gs-phone').value || '').trim(),
        duration: document.getElementById('gs-duration').value,
        arrivalDate: document.getElementById('gs-arrival').value,
        notes: (document.getElementById('gs-notes').value || '').trim(),
        cccdFront: session.guestCccd.front,
        cccdBack: session.guestCccd.back,
        status: 'Mới gửi',
        createdAt: new Date().toLocaleString('vi-VN')
      };
      try {
        if (isSheetConnected() && session.tenantOtp) {
          const res = await callSheetApi({ action: 'submitGuestStay', otp: session.tenantOtp, record });
          if (res.frontUrl) record.cccdFront = res.frontUrl;
          if (res.backUrl) record.cccdBack = res.backUrl;
        } else {
          const queued = JSON.parse(safeStorageGet(GUEST_QUEUE_KEY) || '[]');
          queued.unshift(record);
          safeStorageSet(GUEST_QUEUE_KEY, JSON.stringify(queued));
        }
        session.tenantGuestStays.unshift(record);
        session.guestCccd = { front: '', back: '' };
        render();
        showToast('Đã gửi khai báo lưu trú & ảnh CCCD cho Chủ nhà thành công!', 'success');
      } catch (err) {
        showToast('Lỗi gửi khai báo: ' + err.message, 'error');
      } finally {
        if (btn) { btn.disabled = false; btn.textContent = 'Gửi khai báo lưu trú cho Chủ nhà'; }
      }
    }

    // =========================================================================
    // 8. CAMERA LIVE & XỬ LÝ ẢNH CCCD CHUẨN THẺ 85,6 × 53,98 MM
    // =========================================================================
    function renderCccdSlotInner(src, side) {
      if (!src) {
        return `<div class="text-center p-3 text-[#627D98]">
          <i data-lucide="credit-card" class="w-7 h-7 mx-auto mb-1 text-[#39A7F8]"></i>
          <div class="text-[11px] font-semibold">Khung thẻ CCCD (${side === 'front' ? 'Mặt trước' : 'Mặt sau'})</div>
        </div>`;
      }
      if (src.startsWith('http')) {
        return `<a href="${escapeHtml(src)}" target="_blank" rel="noopener" class="text-xs font-bold text-[#39A7F8] underline">Xem ảnh đã lưu trên Google Drive</a>`;
      }
      return `<img src="${src}" alt="CCCD ${side}" class="w-full h-full object-cover" />`;
    }

    function updateCccdPreview(scope, side, dataUrl) {
      if (scope === 'crm') session.tempCccd[side] = dataUrl;
      else session.guestCccd[side] = dataUrl;
      const box = document.getElementById(`${scope}-cccd-preview-${side}`);
      if (box) {
        box.innerHTML = renderCccdSlotInner(dataUrl, side);
        if (window.lucide) lucide.createIcons();
      }
    }

    function handleCccdFileUpload(e, scope, side) {
      const file = e.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const maxW = 900;
          const scale = Math.min(1, maxW / img.width);
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          updateCccdPreview(scope, side, canvas.toDataURL('image/jpeg', 0.82));
          showToast('Đã tải ảnh CCCD thành công!', 'success');
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
      e.target.value = '';
    }

    function stopCameraStream() {
      if (session.cameraStream) {
        session.cameraStream.getTracks().forEach(tr => tr.stop());
        session.cameraStream = null;
      }
    }

    async function openCameraModal(scope, side) {
      session.cameraTarget = { scope, side };
      const existingOverlay = document.getElementById('camera-overlay');
      if (existingOverlay) existingOverlay.remove();

      const overlay = document.createElement('div');
      overlay.id = 'camera-overlay';
      overlay.className = 'fixed inset-0 z-[70] bg-slate-950/90 backdrop-blur-sm flex items-center justify-center p-4';
      overlay.innerHTML = `
        <div class="w-full max-w-lg bg-slate-900 rounded-[28px] p-5 border border-white/15 space-y-4 text-white">
          <div class="flex items-center justify-between">
            <div>
              <div class="text-sm font-extrabold">Chụp CCCD (${side === 'front' ? 'Mặt trước' : 'Mặt sau'})</div>
              <div class="text-[11px] text-slate-400">Canh thẻ vừa khít khung chuẩn 85,6 × 53,98 mm</div>
            </div>
            <button onclick="closeCameraModal()" class="p-2 rounded-full bg-white/10 hover:bg-white/20"><i data-lucide="x" class="w-4 h-4"></i></button>
          </div>
          <div class="cccd-card-slot cccd-guide-corners bg-black w-full">
            <video id="cccd-video" autoplay playsinline class="w-full h-full object-cover"></video>
          </div>
          <div class="flex items-center justify-between gap-2">
            <button onclick="switchCameraFacing()" class="px-4 py-2.5 rounded-full bg-white/10 hover:bg-white/20 text-xs font-bold flex items-center gap-1.5">
              <i data-lucide="refresh-cw" class="w-4 h-4"></i> Đổi camera
            </button>
            <button onclick="captureCccdPhoto()" class="flex-1 py-2.5 ds-btn-primary text-sm font-extrabold flex items-center justify-center gap-2">
              <i data-lucide="camera" class="w-4 h-4"></i> Chụp ảnh
            </button>
          </div>
        </div>
      `;
      document.body.appendChild(overlay);
      if (window.lucide) lucide.createIcons();
      await startCameraStream();
    }

    async function startCameraStream() {
      stopCameraStream();
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: session.cameraFacing, width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
        session.cameraStream = stream;
        const v = document.getElementById('cccd-video');
        if (v) v.srcObject = stream;
      } catch (_) {
        showToast('Trình duyệt không cấp quyền Camera Live trong khung này. Hãy bấm nút "Tải ảnh / Chọn ảnh" để chụp trực tiếp bằng điện thoại.', 'warning');
        closeCameraModal();
      }
    }

    async function switchCameraFacing() {
      session.cameraFacing = session.cameraFacing === 'environment' ? 'user' : 'environment';
      await startCameraStream();
    }

    function captureCccdPhoto() {
      const v = document.getElementById('cccd-video');
      if (!v || !v.videoWidth || !session.cameraTarget) return;
      const targetRatio = 85.6 / 53.98;
      const vw = v.videoWidth, vh = v.videoHeight;
      let sx = 0, sy = 0, sw = vw, sh = vh;
      if (vw / vh > targetRatio) {
        sw = vh * targetRatio;
        sx = (vw - sw) / 2;
      } else {
        sh = vw / targetRatio;
        sy = (vh - sh) / 2;
      }
      const canvas = document.createElement('canvas');
      canvas.width = 900;
      canvas.height = Math.round(900 / targetRatio);
      canvas.getContext('2d').drawImage(v, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
      updateCccdPreview(session.cameraTarget.scope, session.cameraTarget.side, dataUrl);
      closeCameraModal();
      showToast('Đã chụp ảnh CCCD chuẩn khung thẻ!', 'success');
    }

    function closeCameraModal() {
      stopCameraStream();
      const el = document.getElementById('camera-overlay');
      if (el) el.remove();
    }

    // =========================================================================
    // 9. MODAL KẾT NỐI & CHẨN ĐOÁN GOOGLE SHEET
    // =========================================================================
    function openSheetModal() {
      const inGas = isRunningInAppsScript();
      const currentUrl = getSheetApiUrl();
      openModal(`
        <div class="p-6 sm:p-7 space-y-4">
          <div class="flex items-center justify-between">
            <div>
              <h3 class="text-lg font-extrabold text-[#39A7F8]">Kết nối & Kiểm tra Đồng bộ Google Sheet</h3>
              <p class="text-xs text-[#627D98] mt-0.5">Đồng bộ hai chiều CRM, OTP Cột J, HĐ Hết hiệu lực và ảnh CCCD Google Drive.</p>
            </div>
            <button onclick="closeModal()" class="p-1.5 rounded-full bg-[#E3F4FF] text-[#39A7F8]"><i data-lucide="x" class="w-4 h-4"></i></button>
          </div>

          ${inGas ? `
            <div class="p-4 rounded-2xl bg-[#E3F4FF] text-xs text-[#162B40] space-y-2">
              <div class="font-extrabold text-[#197BC8] flex items-center gap-1.5"><i data-lucide="check-circle-2" class="w-4 h-4"></i> Đang chạy trực tiếp trên Google Apps Script</div>
              <p>Giao diện <code>index.html</code> đã kết nối thẳng với Google Sheet chứa nó. Bấm <strong>Kiểm tra</strong> để xem tên Sheet và số hồ sơ đọc được.</p>
              <div class="flex gap-2 pt-1">
                <button onclick="diagnoseSheetConnection()" class="px-4 py-2 bg-white rounded-full text-[#39A7F8] font-bold">Kiểm tra Sheet</button>
                <button onclick="closeModal(); syncFromSheet(false);" class="px-4 py-2 ds-btn-primary font-bold">Đồng bộ ngay</button>
              </div>
            </div>
          ` : `
            <div class="space-y-2">
              <label class="block text-xs font-bold text-[#162B40]">URL Web App Google Apps Script (/exec)</label>
              <div class="flex flex-col sm:flex-row gap-2">
                <input id="sheet-url-input" type="url" value="${escapeHtml(currentUrl)}" placeholder="https://script.google.com/macros/s/.../exec"
                  class="ds-input flex-1 px-3.5 py-2.5 text-xs font-mono" />
                <button onclick="saveSheetUrl()" class="px-5 py-2.5 ds-btn-primary text-xs font-bold shrink-0">Lưu & Đồng bộ</button>
                <button onclick="diagnoseSheetConnection()" class="px-4 py-2.5 ds-btn-soft text-xs font-bold shrink-0">Kiểm tra</button>
              </div>
            </div>
          `}

          <div id="sheet-diag-box" class="hidden p-3.5 rounded-2xl text-xs border"></div>
        </div>
      `, 'max-w-xl');
    }

    async function diagnoseSheetConnection() {
      const inGas = isRunningInAppsScript();
      const box = document.getElementById('sheet-diag-box');
      if (!box) return;
      if (!inGas) {
        const url = (document.getElementById('sheet-url-input')?.value || '').trim();
        if (!url) {
          box.className = 'p-3.5 rounded-2xl text-xs border bg-rose-50 border-rose-200 text-rose-800';
          box.textContent = 'Vui lòng dán URL Web App (/exec) trước khi kiểm tra.';
          return;
        }
        safeStorageSet(SHEET_URL_STORAGE_KEY, url);
      }
      box.className = 'p-3.5 rounded-2xl text-xs border bg-white border-[#39A7F8]/20 text-[#162B40]';
      box.textContent = 'Đang kiểm tra kết nối và quét dữ liệu trên Google Sheet...';
      try {
        const res = await callSheetApi({ action: 'getData', proof: session.adminApiProof });
        const meta = res.meta || {};
        const count = Array.isArray(res.tenants) ? res.tenants.length : 0;
        const expCount = Array.isArray(res.expiredContracts) ? res.expiredContracts.length : 0;
        box.className = 'p-3.5 rounded-2xl text-xs border bg-[#E3F4FF] border-[#39A7F8]/30 text-[#162B40]';
        box.innerHTML = `<strong>Kết nối chuẩn xác!</strong> Đang đọc sheet <strong>"${escapeHtml(meta.sheetName || '')}"</strong> → tìm thấy <strong>${count} khách đang thuê</strong> và <strong>${expCount} HĐ hết hiệu lực</strong>.`;
      } catch (err) {
        box.className = 'p-3.5 rounded-2xl text-xs border bg-rose-50 border-rose-200 text-rose-800';
        box.textContent = 'Lỗi kết nối: ' + err.message;
      }
    }

    async function saveSheetUrl() {
      const val = (document.getElementById('sheet-url-input')?.value || '').trim();
      safeStorageSet(SHEET_URL_STORAGE_KEY, val);
      closeModal();
      render();
      if (val) {
        showToast('Đã lưu URL Google Sheet. Đang đồng bộ dữ liệu...', 'info');
        await syncFromSheet(false);
      } else {
        showToast('Đã ngắt kết nối Google Sheet, chuyển về chế độ mã hóa cục bộ.', 'info');
      }
    }

    // =========================================================================
    // 10. KHỞI CHẠY ỨNG DỤNG
    // =========================================================================
    function render() {
      const root = document.getElementById('app');
      if (!root) return;

      if (!session.role) {
        root.innerHTML = renderAuth();
      } else if (session.role === 'landlord') {
        root.innerHTML = renderLandlord();
      } else if (session.role === 'tenant') {
        root.innerHTML = renderTenant();
      }

      if (window.lucide) lucide.createIcons();
    }

    window.addEventListener('DOMContentLoaded', () => {
      render();
    });
  </script>
