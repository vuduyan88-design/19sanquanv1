  <style>

<body class="min-h-screen flex flex-col bg-[#EAF2FA] text-[#243B53]">

  <script>
    // =========================================================================
    // 1. CẤU HÌNH HỆ THỐNG, LƯU TRỮ AN TOÀN & BẢO MẬT V3
    // =========================================================================

    // Để trống nếu chạy trực tiếp trong Google Apps Script (index.html).
    // Nếu host riêng trên Netlify/GitHub, dán URL /exec vào đây.
    const DEFAULT_SHEET_API_URL = "";

    // Mã băm SHA-256 có muối của mật khẩu Chủ nhà (không lưu mật khẩu gốc trong mã nguồn)
    const AUTH_SALT = "SQ19_HANOI_2026_";
    const LANDLORD_HASH = "9da3084e7440bc94a58dc4f188ae59ba3b9ebefefefefd2cab43bdfac04b39e3";

    const VAULT_STORAGE_KEY = "sq19_encrypted_vault_v3";
    const TENANT_VAULT_PREFIX = "sq19_room_vault_v3_";
    const SHEET_URL_STORAGE_KEY = "sq19_sheet_api_url_v3";
    const RATE_LIMIT_PREFIX = "sq19_rl_v3_";
    const GUEST_QUEUE_KEY = "sq19_guest_stay_queue_v3";

    // Bọc localStorage an toàn (chống lỗi SecurityError trong iframe trên Safari/iPhone)
    const memoryStorageFallback = {};
    function safeStorageGet(key) {
      try { return window.localStorage.getItem(key); } catch (_) { return memoryStorageFallback[key] ?? null; }
    }
    function safeStorageSet(key, val) {
      try { window.localStorage.setItem(key, val); } catch (_) { memoryStorageFallback[key] = String(val); }
    }
    function safeStorageRemove(key) {
      try { window.localStorage.removeItem(key); } catch (_) { delete memoryStorageFallback[key]; }
    }

    const ALL_ROOM_IDS = [
      '201','202','203',
      '301','302','303',
      '401','402','403',
      '501','502','503',
      '601','602','603',
      '701','702','703'
    ];
    const DEFAULT_ACTIVE_ROOMS = [
      '201','202','203',
      '301','302','303',
      '401','402','403',
      '501','502','503',
      '601','602','603'
    ];

    const session = {
      role: null,
      authStep: 'landing',
      landlordTab: 'rooms',
      tenantRoomId: null,
      tenantOtp: null,
      tenantRoomData: null,
      tenantList: [],
      tenantGuestStays: [],
      showOtpPlain: false,
      showPwPlain: false,
      adminSecret: null,
      adminApiProof: null,
      syncing: false,
      lastSyncAt: null,
      crmSearch: '',
      crmRoomFilter: 'ALL',
      crmResFilter: 'ALL',
      selectedContractRoom: '201',
      contractOpts: { pl1: true, pl2: true, pl3: true, ct01: false },
      tempCccd: { front: '', back: '' },
      guestCccd: { front: '', back: '' },
      cameraStream: null,
      cameraFacing: 'environment',
      cameraTarget: null
    };

    let appState = createEmptyState();
    let pendingConfirmCallback = null;

    function createEmptyState() {
      const rooms = {};
      ALL_ROOM_IDS.forEach(id => {
        rooms[id] = {
          id,
          floor: Number(id.charAt(0)),
          active: DEFAULT_ACTIVE_ROOMS.includes(id),
          status: 'vacant',
          startDate: '',
          termMonths: 12,
          endDate: '',
          rent: 5500000,
          deposit: 5500000,
          depositMonths: 1,
          paymentDay: 5,
          vehicles: 1,
          otp: '',
          otpLocked: false,
          notes: ''
        };
      });
      return {
        rooms,
        tenants: [],
        expiredContracts: [],
        guestStays: [],
        contractDrafts: {}
      };
    }

    (function purgeLegacyPlaintextStorage() {
      ['sq19_app_state_v1', 'sq19_app_state_v2', 'sq19_state'].forEach(k => {
        if (safeStorageGet(k)) safeStorageRemove(k);
      });
    })();

    // =========================================================================
    // 2. BĂM SHA-256 THUẦN JS & MÃ HÓA AES-256-GCM + PBKDF2
    // =========================================================================
    function sha256(ascii) {
      function rightRotate(value, amount) {
        return (value >>> amount) | (value << (32 - amount));
      }
      const mathPow = Math.pow;
      const maxWord = mathPow(2, 32);
      const lengthProperty = 'length';
      let i, j;
      let result = '';
      const words = [];
      const utf8 = unescape(encodeURIComponent(ascii));
      const asciiBitLength = utf8[lengthProperty] * 8;
      let hash = sha256.h = sha256.h || [];
      const k = sha256.k = sha256.k || [];
      let primeCounter = k[lengthProperty];
      const isComposite = {};
      for (let candidate = 2; primeCounter < 64; candidate++) {
        if (!isComposite[candidate]) {
          for (i = 0; i < 313; i += candidate) isComposite[i] = candidate;
          hash[primeCounter] = (mathPow(candidate, 0.5) * maxWord) | 0;
          k[primeCounter++] = (mathPow(candidate, 1 / 3) * maxWord) | 0;
        }
      }
      const padded = utf8 + '\x80';
      let paddedFull = padded;
      while ((paddedFull[lengthProperty] % 64) - 56) paddedFull += '\x00';
      for (i = 0; i < paddedFull[lengthProperty]; i++) {
        j = paddedFull.charCodeAt(i);
        words[i >> 2] |= j << ((3 - i) % 4) * 8;
      }
      words[words[lengthProperty]] = ((asciiBitLength / maxWord) | 0);
      words[words[lengthProperty]] = (asciiBitLength);

      const h = hash.slice(0, 8);
      for (j = 0; j < words[lengthProperty];) {
        const w = words.slice(j, j += 16);
        const oldHash = h.slice(0);
        for (i = 0; i < 64; i++) {
          const w15 = w[i - 15], w2 = w[i - 2];
          const a = h[0], e = h[4];
          const temp1 = h[7]
            + (rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25))
            + ((e & h[5]) ^ ((~e) & h[6]))
            + k[i]
            + (w[i] = (i < 16) ? w[i] : (
              w[i - 16]
              + (rightRotate(w15, 7) ^ rightRotate(w15, 18) ^ (w15 >>> 3))
              + w[i - 7]
              + (rightRotate(w2, 17) ^ rightRotate(w2, 19) ^ (w2 >>> 10))
            ) | 0);
          const temp2 = (rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22))
            + ((a & h[1]) ^ (a & h[2]) ^ (h[1] & h[2]));
          h.unshift((temp1 + temp2) | 0);
          h[4] = (h[4] + temp1) | 0;
          h.pop();
        }
        for (i = 0; i < 8; i++) h[i] = (h[i] + oldHash[i]) | 0;
      }
      for (i = 0; i < 8; i++) {
        for (j = 3; j + 1; j--) {
          const b = (h[i] >> (j * 8)) & 255;
          result += ((b < 16) ? 0 : '') + b.toString(16);
        }
      }
      return result;
    }

    function bytesToBase64(bytes) {
      let binary = '';
      for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
      return btoa(binary);
    }
    function base64ToBytes(b64) {
      const binary = atob(b64);
      const out = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) out[i] = binary.charCodeAt(i);
      return out;
    }
    function hexToBytes(hex) {
      const out = new Uint8Array(hex.length / 2);
      for (let i = 0; i < out.length; i++) out[i] = parseInt(hex.substr(i * 2, 2), 16);
      return out;
    }

    async function encryptPayload(plainText, secret) {
      try {
        if (window.crypto && window.crypto.subtle) {
          const enc = new TextEncoder();
          const salt = window.crypto.getRandomValues(new Uint8Array(16));
          const iv = window.crypto.getRandomValues(new Uint8Array(12));
          const keyMat = await window.crypto.subtle.importKey('raw', enc.encode(secret), 'PBKDF2', false, ['deriveKey']);
          const aesKey = await window.crypto.subtle.deriveKey(
            { name: 'PBKDF2', salt, iterations: 120000, hash: 'SHA-256' },
            keyMat,
            { name: 'AES-GCM', length: 256 },
            false,
            ['encrypt']
          );
          const cipherBuf = await window.crypto.subtle.encrypt({ name: 'AES-GCM', iv }, aesKey, enc.encode(plainText));
          return JSON.stringify({
            v: 'aes-gcm-v3',
            s: bytesToBase64(salt),
            i: bytesToBase64(iv),
            c: bytesToBase64(new Uint8Array(cipherBuf))
          });
        }
      } catch (_) {}

      const nonce = Math.random().toString(36).slice(2) + Date.now().toString(36);
      const dataBytes = new TextEncoder().encode(plainText);
      const out = new Uint8Array(dataBytes.length);
      let block = new Uint8Array(0);
      for (let i = 0; i < dataBytes.length; i++) {
        if (i % 32 === 0) block = hexToBytes(sha256(secret + ':' + nonce + ':' + (i >> 5)));
        out[i] = dataBytes[i] ^ block[i % 32];
      }
      const mac = sha256(secret + ':MAC:' + nonce + ':' + bytesToBase64(out));
      return JSON.stringify({ v: 'sha-ctr-v3', n: nonce, c: bytesToBase64(out), m: mac });
    }

    async function decryptPayload(rawJson, secret) {
      if (!rawJson) return null;
      const pkg = JSON.parse(rawJson);
      if (pkg.v === 'aes-gcm-v3' && window.crypto && window.crypto.subtle) {
        const enc = new TextEncoder();
        const salt = base64ToBytes(pkg.s);
        const iv = base64ToBytes(pkg.i);
        const cipher = base64ToBytes(pkg.c);
        const keyMat = await window.crypto.subtle.importKey('raw', enc.encode(secret), 'PBKDF2', false, ['deriveKey']);
        const aesKey = await window.crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt, iterations: 120000, hash: 'SHA-256' },
          keyMat,
          { name: 'AES-GCM', length: 256 },
          false,
          ['decrypt']
        );
        const plainBuf = await window.crypto.subtle.decrypt({ name: 'AES-GCM', iv }, aesKey, cipher);
        return new TextDecoder().decode(plainBuf);
      }
      if (pkg.v === 'sha-ctr-v3') {
        const expectedMac = sha256(secret + ':MAC:' + pkg.n + ':' + pkg.c);
        if (expectedMac !== pkg.m) throw new Error('Invalid key');
        const cipher = base64ToBytes(pkg.c);
        const out = new Uint8Array(cipher.length);
        let block = new Uint8Array(0);
        for (let i = 0; i < cipher.length; i++) {
          if (i % 32 === 0) block = hexToBytes(sha256(secret + ':' + pkg.n + ':' + (i >> 5)));
          out[i] = cipher[i] ^ block[i % 32];
        }
        return new TextDecoder().decode(out);
      }
      throw new Error('Unsupported vault format');
    }

    async function saveEncryptedVault() {
      if (!session.adminSecret) return;
      try {
        const cipher = await encryptPayload(JSON.stringify(appState), session.adminSecret);
        safeStorageSet(VAULT_STORAGE_KEY, cipher);
        await syncOfflineTenantVaults();
      } catch (err) {
        console.error('Lỗi mã hóa kho dữ liệu:', err);
      }
    }

    async function loadEncryptedVault(secret) {
      const raw = safeStorageGet(VAULT_STORAGE_KEY);
      if (!raw) {
        appState = createEmptyState();
        return;
      }
      const plain = await decryptPayload(raw, secret);
      const parsed = JSON.parse(plain);
      const base = createEmptyState();
      if (parsed && parsed.rooms) {
        ALL_ROOM_IDS.forEach(id => {
          if (parsed.rooms[id]) base.rooms[id] = Object.assign(base.rooms[id], parsed.rooms[id]);
        });
      }
      base.tenants = Array.isArray(parsed.tenants) ? parsed.tenants : [];
      base.expiredContracts = Array.isArray(parsed.expiredContracts) ? parsed.expiredContracts : [];
      base.guestStays = Array.isArray(parsed.guestStays) ? parsed.guestStays : [];
      base.contractDrafts = parsed.contractDrafts || {};
      appState = base;
      mergeOfflineGuestQueueIntoAppState();
    }

    function mergeOfflineGuestQueueIntoAppState() {
      try {
        const raw = safeStorageGet(GUEST_QUEUE_KEY);
        if (!raw) return;
        const queued = JSON.parse(raw);
        if (!Array.isArray(queued) || !queued.length) return;
        const existingIds = new Set((appState.guestStays || []).map(x => x.id));
        let added = 0;
        queued.forEach(item => {
          if (item && item.id && !existingIds.has(item.id)) {
            appState.guestStays.unshift(item);
            added++;
          }
        });
        if (added > 0) saveEncryptedVault();
      } catch (_) {}
    }

    async function syncOfflineTenantVaults() {
      try {
        for (const id of ALL_ROOM_IDS) {
          const room = appState.rooms[id];
          const key = TENANT_VAULT_PREFIX + id;
          if (!room || !room.active || !room.otp || room.otpLocked) {
            safeStorageRemove(key);
            continue;
          }
          const safeRoom = Object.assign({}, room, { otp: '' });
          const tenants = getRoomTenants(id);
          const otpHash = sha256('SQ19_OTP_V3_' + id + '_' + room.otp);
          const payload = await encryptPayload(JSON.stringify({ room: safeRoom, tenants }), 'OTP_' + id + '_' + room.otp);
          safeStorageSet(key, JSON.stringify({ h: otpHash, p: payload }));
        }
      } catch (_) {}
    }

    function checkRateLimit(bucket) {
      try {
        const raw = safeStorageGet(RATE_LIMIT_PREFIX + bucket);
        if (!raw) return { blocked: false, waitSec: 0 };
        const obj = JSON.parse(raw);
        if (obj.until && Date.now() < obj.until) {
          return { blocked: true, waitSec: Math.ceil((obj.until - Date.now()) / 1000) };
        }
      } catch (_) {}
      return { blocked: false, waitSec: 0 };
    }
    function recordFailedAttempt(bucket) {
      try {
        const raw = safeStorageGet(RATE_LIMIT_PREFIX + bucket);
        const obj = raw ? JSON.parse(raw) : { count: 0, until: 0 };
        if (obj.until && Date.now() >= obj.until) obj.count = 0;
        obj.count += 1;
        if (obj.count >= 5) {
          obj.until = Date.now() + 60000;
          obj.count = 0;
        }
        safeStorageSet(RATE_LIMIT_PREFIX + bucket, JSON.stringify(obj));
        return obj.until > Date.now() ? 60 : 0;
      } catch (_) { return 0; }
    }
    function clearRateLimit(bucket) {
      safeStorageRemove(RATE_LIMIT_PREFIX + bucket);
    }

    // =========================================================================
    // 3. KẾT NỐI GOOGLE SHEET API (HỖ TRỢ CHẠY TRỰC TIẾP TRONG APPS SCRIPT)
    // =========================================================================
    function isRunningInAppsScript() {
      return typeof google !== 'undefined' && google.script && google.script.run;
    }
    function getSheetApiUrl() {
      const saved = (safeStorageGet(SHEET_URL_STORAGE_KEY) || '').trim();
      return saved || DEFAULT_SHEET_API_URL.trim();
    }
    function isSheetConnected() {
      return isRunningInAppsScript() || Boolean(getSheetApiUrl());
    }

    async function callSheetApi(payload) {
      if (isRunningInAppsScript()) {
        return new Promise((resolve, reject) => {
          google.script.run
            .withSuccessHandler((resStr) => {
              try {
                const data = typeof resStr === 'string' ? JSON.parse(resStr) : resStr;
                if (!data || !data.ok) reject(new Error((data && data.error) || 'Lỗi từ Google Apps Script'));
                else resolve(data);
              } catch (_) {
                reject(new Error('Phản hồi từ Google Apps Script không hợp lệ.'));
              }
            })
            .withFailureHandler((err) => reject(new Error((err && err.message) || String(err))))
            .apiDispatch(JSON.stringify(payload));
        });
      }
      const url = getSheetApiUrl();
      if (!url) throw new Error('Chưa cấu hình URL Google Sheet Web App.');
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      const text = await res.text();
      let data;
      try { data = JSON.parse(text); } catch (_) {
        throw new Error('Phản hồi từ Google Apps Script không hợp lệ. Kiểm tra lại quyền "Bất kỳ ai".');
      }
      if (!data.ok) throw new Error(data.error || 'Lỗi từ Google Apps Script');
      return data;
    }

    async function syncFromSheet(silent = false) {
      if (!isSheetConnected() || !session.adminApiProof) return false;
      session.syncing = true;
      render();
      try {
        const res = await callSheetApi({ action: 'getData', proof: session.adminApiProof });
        if (res.rooms) {
          ALL_ROOM_IDS.forEach(id => {
            if (res.rooms[id]) appState.rooms[id] = Object.assign(appState.rooms[id], res.rooms[id]);
          });
        }
        if (Array.isArray(res.tenants)) {
          appState.tenants = res.tenants;
          appState.tenants.forEach(t => {
            if (t.room && appState.rooms[t.room]) {
              const r = appState.rooms[t.room];
              r.active = true;
              if (r.status === 'vacant') r.status = 'active';
              if (!r.otp && t.sheetOtp) { r.otp = t.sheetOtp; r.otpLocked = false; }
              if (!r.startDate && t.sheetStartDate) r.startDate = t.sheetStartDate;
              if (!r.endDate && t.sheetEndDate) r.endDate = t.sheetEndDate;
            }
          });
        }
        if (Array.isArray(res.expiredContracts)) appState.expiredContracts = res.expiredContracts;
        if (Array.isArray(res.guestStays)) appState.guestStays = res.guestStays;
        mergeOfflineGuestQueueIntoAppState();
        session.lastSyncAt = new Date().toLocaleTimeString('vi-VN');
        await saveEncryptedVault();
        if (!silent) {
          const count = appState.tenants.length;
          const sheetInfo = res.meta && res.meta.sheetName ? ` từ sheet "${res.meta.sheetName}"` : '';
          if (count > 0) {
            showToast(`Đã đồng bộ thành công ${count} hồ sơ khách thuê${sheetInfo}!`, 'success');
          } else {
            showToast(`Kết nối thành công${sheetInfo} nhưng chưa thấy hồ sơ nào.`, 'warning');
          }
        }
        return true;
      } catch (err) {
        if (!silent) showToast('Không thể đồng bộ Google Sheet: ' + err.message, 'error');
        return false;
      } finally {
        session.syncing = false;
        render();
      }
    }

    function escapeHtml(str) {
      return String(str == null ? '' : str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')

      const root = document.getElementById('toast-root');

        warning: 'bg-amber-500 text-white border-amber-400',
        info: 'bg-slate-800 text-white border-slate-700'

      const el = document.createElement('div');
      el.className = `pointer-events-auto px-4 py-3 rounded-2xl shadow-lg border text-xs sm:text-sm font-semibold transition-all duration-300 ${styles[type] || styles.info}`;

        setTimeout(() => el.remove(), 300);

    function copyTextSafe(text, successMsg = 'Đã sao chép!') {
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast(successMsg, 'success');
      } catch (_) {
        showToast('Không thể tự động sao chép, vui lòng bôi đen copy thủ công.', 'warning');

    function formatDateVN(isoDate) {
      if (!isoDate) return '—';
      const s = String(isoDate).trim();
      const m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
      if (m) return `${m[3]}/${m[2]}/${m[1]}`;
      return s;
    }

    function addMonthsToDate(isoDate, months) {
      if (!isoDate) return '';
      const d = new Date(isoDate + 'T00:00:00');
      if (isNaN(d.getTime())) return '';
      d.setMonth(d.getMonth() + Number(months || 0));
      return d.toISOString().slice(0, 10);
    }

    function daysUntil(isoDate) {
      if (!isoDate) return null;
      const target = new Date(String(isoDate).slice(0, 10) + 'T00:00:00');
      if (isNaN(target.getTime())) return null;
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      return Math.round((target.getTime() - today.getTime()) / 86400000);
    }

    function formatVND(amount) {
      const n = Number(amount || 0);
      return n ? n.toLocaleString('vi-VN') + ' VNĐ' : '0 VNĐ';
    }

    function numberToVietnameseWords(num) {
      const n = Math.round(Number(num) || 0);
      if (n <= 0) return 'Không đồng';
      const units = ['', 'nghìn', 'triệu', 'tỷ'];
      const digits = ['không', 'một', 'hai', 'ba', 'bốn', 'năm', 'sáu', 'bảy', 'tám', 'chín'];
      const readTriple = (val, full) => {
        const h = Math.floor(val / 100);
        const t = Math.floor((val % 100) / 10);
        const u = val % 10;
        let out = '';
        if (h > 0 || full) out += digits[h] + ' trăm ';
        if (t > 1) {
          out += digits[t] + ' mươi ';
          if (u === 1) out += 'mốt ';
          else if (u === 5) out += 'lăm ';
          else if (u > 0) out += digits[u] + ' ';
        } else if (t === 1) {
          out += 'mười ';
          if (u === 5) out += 'lăm ';
          else if (u > 0) out += digits[u] + ' ';
        } else if (u > 0) {
          if (h > 0 || full) out += 'linh ';
          out += digits[u] + ' ';
        }
        return out.trim();
      };
      const parts = [];
      let rem = n;
      let idx = 0;
      while (rem > 0 && idx < units.length) {
        const grp = rem % 1000;
        if (grp > 0) {
          const full = rem >= 1000;
          parts.unshift((readTriple(grp, full) + (units[idx] ? ' ' + units[idx] : '')).trim());
        }
        rem = Math.floor(rem / 1000);
        idx++;
      }
      const res = parts.join(' ').trim() + ' đồng chẵn';
      return res.charAt(0).toUpperCase() + res.slice(1);
    }

    function getRoomStatusInfo(room) {
      if (!room || room.status === 'vacant') {
        return {
          key: 'vacant',
          label: 'Phòng trống',
          bg: 'bg-slate-50/90',
          border: 'border-slate-200/80',
          badge: 'bg-slate-200/80 text-slate-700',
          dot: 'bg-slate-400'
        };
      }
      const d = daysUntil(room.endDate);
      if (room.status === 'expired' || (d !== null && d < 0)) {
        return {
          key: 'expired',
          label: d !== null && d < 0 ? `Hết hạn (${Math.abs(d)} ngày)` : 'Hết hạn HĐ',
          bg: 'bg-rose-50/80',
          border: 'border-rose-200',
          badge: 'bg-rose-100 text-rose-700',
          dot: 'bg-rose-500'
        };
      }
      if (d !== null && d <= 30) {
        return {
          key: 'expiring',
          label: `Sắp hết hạn (${d} ngày)`,
          bg: 'bg-amber-50/80',
          border: 'border-amber-200',
          badge: 'bg-amber-100 text-amber-800',
          dot: 'bg-amber-500'
        };
      }
      if (room.status === 'extended') {
        return {
          key: 'extended',
          label: 'Gia hạn thêm',
          bg: 'bg-violet-50/75',
          border: 'border-violet-200',
          badge: 'bg-violet-100 text-violet-700',
          dot: 'bg-violet-500'
        };
      }
      return {
        key: 'active',
        label: d !== null ? `Còn hạn (${d} ngày)` : 'Đang thuê',
        bg: 'bg-emerald-50/70',
        border: 'border-emerald-200',
        badge: 'bg-emerald-100 text-emerald-700',
        dot: 'bg-emerald-500'
      };
    }

    function getResidenceBadge(tenant) {
      const st = tenant?.residenceStatus || 'Chưa khai báo';
      const d = daysUntil(tenant?.residenceExpiry);
      if (st === 'Đã đăng ký') {
        if (d !== null && d < 0) return { label: 'Hết hiệu lực', cls: 'bg-rose-100 text-rose-700', valid: false };
        if (d !== null && d <= 15) return { label: `Sắp hết hạn (${d} ngày)`, cls: 'bg-amber-100 text-amber-800', valid: true };
        return { label: 'Còn hiệu lực', cls: 'bg-emerald-100 text-emerald-700', valid: true };
      }
      if (st === 'Đang xử lý') return { label: 'Đang xử lý', cls: 'bg-sky-100 text-sky-700', valid: false };
      return { label: 'Chưa khai báo', cls: 'bg-rose-100 text-rose-700', valid: false };
    }

    async function handleLandlordLogin(e) {
      e.preventDefault();
      const rl = checkRateLimit('landlord');
      if (rl.blocked) {
        showToast(`Bạn đã nhập sai quá 5 lần. Vui lòng thử lại sau ${rl.waitSec} giây.`, 'error');
        return;
      }
      const pw = (document.getElementById('landlord-pw-input')?.value || '').trim();
      const hashed = sha256(AUTH_SALT + pw);
      if (hashed !== LANDLORD_HASH) {
        const locked = recordFailedAttempt('landlord');
        showToast(locked ? 'Nhập sai quá 5 lần! Tạm khóa đăng nhập 60 giây.' : 'Mật khẩu Chủ nhà không chính xác.', 'error');
        return;
      }
      clearRateLimit('landlord');
      session.role = 'landlord';
      session.adminSecret = pw;
      session.adminApiProof = sha256('SQ19_API_PROOF_V3_' + pw);
      try {
        await loadEncryptedVault(pw);
      } catch (_) {
        appState = createEmptyState();
      }
      render();
      showToast('Đăng nhập Chủ nhà thành công!', 'success');
      if (isSheetConnected()) {
        syncFromSheet(false);
      }
    }

    async function handleTenantLogin(e) {
      e.preventDefault();
      const rl = checkRateLimit('tenant');
      if (rl.blocked) {
        showToast(`Nhập sai OTP quá 5 lần. Vui lòng chờ ${rl.waitSec} giây.`, 'error');
        return;
      }
      const otp = (document.getElementById('tenant-otp-input')?.value || '').trim();
      if (!otp) return;

      const btn = document.getElementById('tenant-login-btn');
      if (btn) { btn.disabled = true; btn.textContent = 'Đang xác thực OTP...'; }

      try {
        if (isSheetConnected()) {
          const res = await callSheetApi({ action: 'verifyOtp', otp });
          clearRateLimit('tenant');
          session.role = 'tenant';
          session.tenantOtp = otp;
          session.tenantRoomId = res.room.id;
          session.tenantRoomData = res.room;
          session.tenantList = Array.isArray(res.tenants) ? res.tenants : [];
          session.tenantGuestStays = Array.isArray(res.guestStays) ? res.guestStays : [];
          render();
          showToast(`Chào mừng cư dân Phòng ${res.room.id}!`, 'success');
          return;
        }

        for (const id of ALL_ROOM_IDS) {
          const raw = safeStorageGet(TENANT_VAULT_PREFIX + id);
          if (!raw) continue;
          const pkg = JSON.parse(raw);
          const expectedHash = sha256('SQ19_OTP_V3_' + id + '_' + otp);
          if (pkg.h === expectedHash) {
            const plain = await decryptPayload(pkg.p, 'OTP_' + id + '_' + otp);
            const data = JSON.parse(plain);
            clearRateLimit('tenant');
            session.role = 'tenant';
            session.tenantOtp = otp;
            session.tenantRoomId = id;
            session.tenantRoomData = data.room;
            session.tenantList = Array.isArray(data.tenants) ? data.tenants : [];
            const queued = JSON.parse(safeStorageGet(GUEST_QUEUE_KEY) || '[]');
            session.tenantGuestStays = queued.filter(g => String(g.roomId) === String(id));
            render();
            showToast(`Chào mừng cư dân Phòng ${id}!`, 'success');
            return;
          }
        }
        throw new Error('Mã OTP không đúng hoặc phòng đang bị khóa.');
      } catch (err) {
        const locked = recordFailedAttempt('tenant');
        showToast(locked ? 'Nhập sai quá 5 lần! Tạm khóa 60 giây.' : (err.message || 'Mã OTP không chính xác.'), 'error');
      } finally {
        if (btn) { btn.disabled = false; btn.textContent = 'Truy cập thông tin phòng'; }
      }
    }

      const pendingGuests = (appState.guestStays || []).filter(g => g.status === 'Mới gửi').length;
      const connected = isSheetConnected();
      const tabs = [
        { id: 'rooms', label: 'Phòng', icon: 'layout-grid' },
        { id: 'crm', label: 'Khách', icon: 'users' },
        { id: 'residence', label: 'Tạm trú', icon: 'file-badge' },
        { id: 'contract', label: 'Hợp đồng', icon: 'file-text' },
        { id: 'expired', label: 'Hết hạn', icon: 'archive' },
        { id: 'otp', label: 'OTP', icon: 'key' }
      ];

      let bodyHtml = '';
      if (session.landlordTab === 'rooms') bodyHtml = renderRoomsTab();
      else if (session.landlordTab === 'crm') bodyHtml = renderCrmTab();
      else if (session.landlordTab === 'residence') bodyHtml = renderResidenceTab();
      else if (session.landlordTab === 'contract') bodyHtml = renderContractTab();
      else if (session.landlordTab === 'expired') bodyHtml = renderExpiredTab();

                  <i data-lucide="sheet" class="w-4 h-4"></i>
                </button>
                <div class="min-w-0">
                  <div class="text-xs font-bold tracking-[0.22em] uppercase text-[#243B53] truncate">19 SÂN QUẦN</div>
                  <div class="flex items-center gap-1.5 text-[10px] font-semibold text-[#6B8299]">
                    <span class="w-1.5 h-1.5 rounded-full ${connected ? 'bg-emerald-500' : 'bg-slate-400'}"></span>
                    <span class="truncate">${connected ? (session.lastSyncAt ? 'Đã đồng bộ ' + session.lastSyncAt : 'Kết nối Sheet') : 'Offline'}</span>
                  </div>
                </div>
              </div>

              <!-- Menu Desktop -->
              <nav class="hidden lg:flex items-center gap-1.5 p-1.5 rounded-2xl neu-inset">
                ${tabs.map(t => `
                  <button onclick="switchLandlordTab('${t.id}')" class="px-3.5 py-2 rounded-xl text-xs font-semibold flex items-center gap-1.5 transition ${session.landlordTab === t.id ? 'neu-btn text-[#6E59F0] font-bold' : 'text-[#6B8299] hover:text-[#243B53]'}">
                    <i data-lucide="${t.icon}" class="w-3.5 h-3.5"></i>
                    <span>${t.label}</span>
                  </button>
                `).join('')}
              </nav>

              <!-- Nút thao tác nhanh -->
              <div class="flex items-center gap-2 shrink-0">
                <button onclick="openGuestNotificationsModal()" title="Thông báo lưu trú" class="relative w-10 h-10 rounded-2xl neu-btn flex items-center justify-center text-[#243B53]">
                  <i data-lucide="bell" class="w-4 h-4"></i>
                  ${pendingGuests > 0 ? `<span class="absolute -top-1 -right-1 min-w-[18px] h-[18px] px-1 rounded-full bg-[#F857A6] text-white text-[10px] font-bold flex items-center justify-center shadow-sm">${pendingGuests}</span>` : ''}
                </button>
                ${connected ? `
                  <button onclick="syncFromSheet(false)" title="Đồng bộ ngay" class="w-10 h-10 rounded-2xl neu-btn flex items-center justify-center text-[#243B53] ${session.syncing ? 'animate-spin' : ''}">
                    <i data-lucide="refresh-cw" class="w-4 h-4"></i>

            ${tabs.map(t => `
              <button onclick="switchLandlordTab('${t.id}')" class="flex flex-col items-center justify-center py-2 rounded-2xl transition ${session.landlordTab === t.id ? 'neu-nav-active' : 'text-[#6B8299]'}">

    // --- TAB 1: SƠ ĐỒ PHÒNG (VÒNG TRÒN TỶ LỆ & CỘT CHỈ SỐ SOFT UI) ---
    function renderRoomsTab() {
      const activeIds = getActiveRoomIds();
      const total = activeIds.length || 1;
      let cActive = 0, cExpiring = 0, cExpired = 0, cVacant = 0;
      activeIds.forEach(id => {
        const st = getRoomStatusInfo(appState.rooms[id]).key;
        if (st === 'vacant') cVacant++;
        else if (st === 'expired') cExpired++;
        else if (st === 'expiring') cExpiring++;
        else cActive++;
      });
      const occupiedPct = Math.round(((total - cVacant) / total) * 100);
      const ringCirc = 2 * Math.PI * 42;
      const ringOffset = ringCirc * (1 - occupiedPct / 100);

      const bars = [
        { label: 'Đang thuê', count: cActive, pct: Math.round((cActive / total) * 100), grad: 'from-[#56CCF2] to-[#3B82F6]' },
        { label: 'Sắp hết', count: cExpiring, pct: Math.round((cExpiring / total) * 100), grad: 'from-[#F6C26B] to-[#F2994A]' },
        { label: 'Quá hạn', count: cExpired, pct: Math.round((cExpired / total) * 100), grad: 'from-[#FF7EB3] to-[#F857A6]' },
        { label: 'Trống', count: cVacant, pct: Math.round((cVacant / total) * 100), grad: 'from-[#A5B4FC] to-[#7C62F6]' }
      ];

      return `
        <div class="space-y-5">
          <!-- Thẻ thống kê tối giản lấy cảm hứng trực tiếp từ ảnh mẫu -->
          <div class="neu-card p-5 sm:p-6 space-y-5">
            <div class="flex items-center justify-between gap-2">
              <div>
                <h1 class="text-xl font-bold text-[#243B53]">Tổng quan ${activeIds.length} phòng</h1>
                <p class="text-xs text-[#6B8299] mt-0.5">Chạm vào từng phòng để chỉnh hạn HĐ hoặc thanh lý</p>
              </div>
              <div class="flex items-center gap-2">
                <button onclick="openRoomConfigModal()" title="Cấu hình số phòng" class="w-10 h-10 rounded-2xl neu-btn flex items-center justify-center text-[#5A7087]">
                  <i data-lucide="sliders-horizontal" class="w-4 h-4"></i>
                </button>
                <button onclick="openTenantFormModal()" title="Thêm khách thuê" class="px-3.5 h-10 rounded-2xl neu-btn-primary text-xs font-bold flex items-center gap-1.5">
                  <i data-lucide="plus" class="w-4 h-4"></i>
                  <span class="hidden sm:inline">Thêm khách</span>
                </button>
              </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-12 gap-5 items-center">
              <!-- Vòng tròn tỷ lệ lấp đầy -->
              <div class="md:col-span-5 flex items-center justify-center">
                <div class="w-36 h-36 rounded-full neu-card flex items-center justify-center relative">
                  <svg viewBox="0 0 110 110" class="w-32 h-32 -rotate-90">
                    <defs>
                      <linearGradient id="occGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#6E7BF2"/>
                        <stop offset="100%" stop-color="#9B51E0"/>
                      </linearGradient>
                    </defs>
                    <circle cx="55" cy="55" r="42" fill="none" stroke="#DCE7F3" stroke-width="12" />
                    <circle cx="55" cy="55" r="42" fill="none" stroke="url(#occGrad)" stroke-width="12" stroke-linecap="round"
                      stroke-dasharray="${ringCirc.toFixed(1)}" stroke-dashoffset="${ringOffset.toFixed(1)}" />
                  </svg>
                  <div class="absolute inset-0 flex flex-col items-center justify-center">
                    <span class="text-xl font-extrabold text-[#243B53]">${occupiedPct}%</span>
                    <span class="text-[10px] font-semibold text-[#6B8299]">Lấp đầy</span>
                  </div>
                </div>
              </div>

              <!-- 4 cột chỉ số dạng thanh đứng mềm mại -->
              <div class="md:col-span-7 grid grid-cols-4 gap-3 text-center">
                ${bars.map(b => `
                  <div class="flex flex-col items-center">
                    <div class="w-7 h-24 rounded-full neu-inset p-1 flex items-end overflow-hidden">
                      <div class="w-full rounded-full bg-gradient-to-t ${b.grad} transition-all" style="height:${Math.max(b.count ? 18 : 0, b.pct)}%"></div>
                    </div>
                    <span class="text-[11px] font-semibold text-[#6B8299] mt-2">${b.label}</span>
                    <span class="text-xs font-extrabold text-[#243B53]">${b.count}</span>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>

          <!-- Lưới phòng tối giản cho Mobile & Desktop -->
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
            ${activeIds.map(id => {
              const room = appState.rooms[id];
              const st = getRoomStatusInfo(room);
              const tenants = getRoomTenants(id);
              return `
                <div onclick="openRoomDetailModal('${id}')" class="cursor-pointer neu-card-sm p-4 sm:p-5 flex flex-col justify-between gap-3 active:scale-[0.99] transition">
                  <div class="flex items-start justify-between gap-2">
                    <div class="flex items-center gap-3">
                      <div class="w-11 h-11 rounded-2xl neu-inset flex items-center justify-center font-extrabold text-sm text-[#243B53]">${id}</div>
                      <div>
                        <div class="text-sm font-bold text-[#243B53]">Phòng ${id}</div>
                        <div class="text-[11px] text-[#6B8299]">${tenants.length} người · ${room.vehicles || 0} xe</div>
                      </div>
                    </div>
                    <span class="px-2.5 py-1 rounded-full text-[10px] font-bold ${st.badge} shrink-0">${st.label}</span>
                  </div>

                  <div class="space-y-1.5">
                    ${tenants.length ? tenants.map(t => `
                      <div class="flex items-center justify-between text-xs neu-inset rounded-xl px-3 py-2">
                        <span class="font-semibold text-[#243B53] truncate">${escapeHtml(t.fullName)}</span>
                        <span class="text-[10px] text-[#6B8299] ml-2 shrink-0">${escapeHtml(t.phone || t.roleInRoom)}</span>
                      </div>
                    `).join('') : `<div class="text-xs text-[#7D93AA] px-1">Phòng đang trống</div>`}
                  </div>

                  <div class="flex items-center justify-between text-[11px] text-[#6B8299] pt-1">
                    <span>${room.startDate ? (formatDateVN(room.startDate) + ' → ' + formatDateVN(room.endDate)) : 'Chưa đặt hạn HĐ'}</span>
                    <span class="font-bold text-[#6E59F0]">${room.rent ? (room.rent / 1000000).toFixed(1) + 'tr' : '—'}</span>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function openRoomConfigModal() {
      openModal(`
        <div class="p-6 sm:p-7 space-y-4">
          <div class="flex items-center justify-between">
            <h3 class="text-lg font-extrabold text-slate-900">Cấu hình danh sách phòng hoạt động</h3>
            <button onclick="closeModal()" class="p-1.5 rounded-xl hover:bg-slate-100 text-slate-400"><i data-lucide="x" class="w-5 h-5"></i></button>
          </div>
          <p class="text-xs text-slate-500">Bật/tắt các mã phòng từ tầng 2 đến tầng 7 theo thực tế tòa nhà (15 đến 18 phòng).</p>
          <div class="grid grid-cols-3 gap-2.5">
            ${ALL_ROOM_IDS.map(id => {
              const r = appState.rooms[id];
              return `
                <label class="flex items-center gap-2 p-3 rounded-2xl border ${r.active ? 'bg-[#EEF8F6] border-emerald-300' : 'bg-slate-50 border-slate-200'} cursor-pointer">
                  <input type="checkbox" id="cfg-room-${id}" ${r.active ? 'checked' : ''} class="w-4 h-4 accent-[#156B68]" />

          </div>
        </div>
      `, 'max-w-lg');
    }

    async function saveRoomConfig() {
      for (const id of ALL_ROOM_IDS) {
        const el = document.getElementById('cfg-room-' + id);
        if (el) appState.rooms[id].active = el.checked;
      }
      await saveEncryptedVault();
      closeModal();
      render();
      showToast('Đã cập nhật cấu hình số phòng.', 'success');
    }

    function openRoomDetailModal(roomId) {
      const r = appState.rooms[roomId];
      const tenants = getRoomTenants(roomId);
      openModal(`
        <div class="p-6 sm:p-7 space-y-5">
          <div class="flex items-center justify-between">
            <div>
              <h3 class="text-xl font-extrabold text-slate-900">Chi tiết Phòng ${roomId}</h3>
              <p class="text-xs text-slate-500 mt-0.5">${tenants.length} cư dân đang đăng ký tại phòng này</p>

            <button onclick="closeModal()" class="p-1.5 rounded-xl hover:bg-slate-100 text-slate-400"><i data-lucide="x" class="w-5 h-5"></i></button>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
            <div>
              <label class="font-bold text-slate-700 block mb-1">Trạng thái phòng</label>
              <select id="rm-status" class="w-full px-3.5 py-2.5 rounded-2xl border border-slate-200 bg-white font-semibold">
                <option value="vacant" ${r.status === 'vacant' ? 'selected' : ''}>Phòng trống</option>
                <option value="active" ${r.status === 'active' ? 'selected' : ''}>Đang thuê (Còn hạn)</option>

                <option value="expired" ${r.status === 'expired' ? 'selected' : ''}>Hết hạn hợp đồng</option>
              </select>

            <div>
              <label class="font-bold text-slate-700 block mb-1">Kỳ hạn hợp đồng</label>
              <select id="rm-term" onchange="autoCalcRoomEnd()" class="w-full px-3.5 py-2.5 rounded-2xl border border-slate-200 bg-white font-semibold">
                <option value="6" ${Number(r.termMonths) === 6 ? 'selected' : ''}>6 tháng</option>
                <option value="12" ${Number(r.termMonths) === 12 ? 'selected' : ''}>12 tháng</option>
                <option value="24" ${Number(r.termMonths) === 24 ? 'selected' : ''}>24 tháng</option>
              </select>
            </div>
            <div>
              <label class="font-bold text-slate-700 block mb-1">Ngày vào ở (Bắt đầu HĐ)</label>
              <input id="rm-start" type="date" value="${escapeHtml(r.startDate)}" onchange="autoCalcRoomEnd()" class="w-full px-3.5 py-2.5 rounded-2xl border border-slate-200 font-semibold" />
            </div>
            <div>
              <label class="font-bold text-slate-700 block mb-1">Ngày kết thúc HĐ</label>
              <input id="rm-end" type="date" value="${escapeHtml(r.endDate)}" class="w-full px-3.5 py-2.5 rounded-2xl border border-slate-200 font-semibold" />
            </div>
            <div>
              <label class="font-bold text-slate-700 block mb-1">Giá thuê (VNĐ/tháng)</label>
              <input id="rm-rent" type="number" value="${r.rent || 0}" class="w-full px-3.5 py-2.5 rounded-2xl border border-slate-200 font-semibold" />
            </div>
            <div>
              <label class="font-bold text-slate-700 block mb-1">Tiền đặt cọc (VNĐ)</label>
              <input id="rm-deposit" type="number" value="${r.deposit || 0}" class="w-full px-3.5 py-2.5 rounded-2xl border border-slate-200 font-semibold" />
            </div>
            <div>
              <label class="font-bold text-slate-700 block mb-1">Số xe đăng ký</label>
              <input id="rm-vehicles" type="number" min="0" value="${r.vehicles || 0}" class="w-full px-3.5 py-2.5 rounded-2xl border border-slate-200 font-semibold" />
            </div>
            <div>
              <label class="font-bold text-slate-700 block mb-1">Ngày thanh toán hàng tháng</label>
              <input id="rm-payday" type="number" min="1" max="31" value="${r.paymentDay || 5}" class="w-full px-3.5 py-2.5 rounded-2xl border border-slate-200 font-semibold" />
            </div>
          </div>

          <div class="p-3.5 rounded-2xl bg-violet-50/70 border border-violet-200 flex flex-wrap items-center justify-between gap-2">
            <span class="text-xs font-bold text-violet-900">Gia hạn nhanh hợp đồng:</span>
            <div class="flex gap-1.5">
              <button onclick="quickExtendRoom('${roomId}', 6)" class="px-3 py-1.5 rounded-full bg-white hover:bg-violet-100 border border-violet-200 text-violet-700 text-xs font-bold">+6 tháng</button>
              <button onclick="quickExtendRoom('${roomId}', 12)" class="px-3 py-1.5 rounded-full bg-white hover:bg-violet-100 border border-violet-200 text-violet-700 text-xs font-bold">+12 tháng</button>
              <button onclick="quickExtendRoom('${roomId}', 24)" class="px-3 py-1.5 rounded-full bg-white hover:bg-violet-100 border border-violet-200 text-violet-700 text-xs font-bold">+24 tháng</button>

              <button onclick="closeModal(); session.selectedContractRoom='${roomId}'; switchLandlordTab('contract');" class="px-3.5 py-2.5 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold">Xuất Hợp đồng</button>
            </div>
            <button onclick="saveRoomDetails('${roomId}')" class="px-5 py-2.5 rounded-full bg-[#156B68] hover:bg-[#0F5350] text-white text-xs font-bold">Lưu thông tin phòng</button>
          </div>
        </div>
      `);

    function autoCalcRoomEnd() {
      const s = document.getElementById('rm-start')?.value;
      const t = Number(document.getElementById('rm-term')?.value || 12);
      const eEl = document.getElementById('rm-end');
      if (s && eEl) eEl.value = addMonthsToDate(s, t);
    }

    function quickExtendRoom(roomId, addMonths) {
      const endEl = document.getElementById('rm-end');
      const statusEl = document.getElementById('rm-status');
      const base = (endEl && endEl.value) ? endEl.value : new Date().toISOString().slice(0, 10);
      if (endEl) endEl.value = addMonthsToDate(base, addMonths);
      if (statusEl) statusEl.value = 'extended';
      showToast(`Đã cộng thêm ${addMonths} tháng. Bấm "Lưu thông tin phòng" để xác nhận.`, 'info');
    }

    async function saveRoomDetails(roomId) {
      const r = appState.rooms[roomId];
      r.status = document.getElementById('rm-status').value;
      r.termMonths = Number(document.getElementById('rm-term').value || 12);
      r.startDate = document.getElementById('rm-start').value;
      r.endDate = document.getElementById('rm-end').value;
      r.rent = Number(document.getElementById('rm-rent').value || 0);
      r.deposit = Number(document.getElementById('rm-deposit').value || 0);
      r.vehicles = Number(document.getElementById('rm-vehicles').value || 0);
      r.paymentDay = Number(document.getElementById('rm-payday').value || 5);
      await saveEncryptedVault();
      await pushActionToSheet('updateRoom', { room: r });
      closeModal();
      render();
      showToast(`Đã lưu thông tin Phòng ${roomId}!`, 'success');
    }

      const today = new Date().toISOString().slice(0, 10);
      openModal(`
        <div class="p-6 sm:p-7 space-y-4">
          <div class="flex items-center justify-between">
            <h3 class="text-lg font-extrabold text-rose-700">Thanh lý & Chuyển HĐ Hết hiệu lực — Phòng ${roomId}</h3>
            <button onclick="closeModal()" class="p-1.5 rounded-xl hover:bg-slate-100 text-slate-400"><i data-lucide="x" class="w-5 h-5"></i></button>
          </div>
          <p class="text-xs text-slate-600 leading-relaxed">

          <div class="p-3.5 rounded-2xl bg-slate-50 border border-slate-200 text-xs">

            <div class="text-slate-600 mt-1">${tenants.length ? tenants.map(t => escapeHtml(t.fullName)).join(', ') : 'Không có khách gán phòng'}</div>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
            <div>
              <label class="font-bold text-slate-700 block mb-1">Ngày trả phòng thực tế</label>
              <input id="arc-moveout" type="date" value="${today}" class="w-full px-3.5 py-2.5 rounded-2xl border border-slate-200 font-semibold" />

    async function confirmArchiveContract(roomId) {
      const r = appState.rooms[roomId];
      const tenants = getRoomTenants(roomId);
      const record = {
        id: 'EXP_' + Date.now(),
        roomId,
        tenantNames: tenants.map(t => t.fullName).join(', ') || 'Không rõ',
        cccds: tenants.map(t => t.cccd).filter(Boolean).join(', '),
        phones: tenants.map(t => t.phone).filter(Boolean).join(', '),
        startDate: r.startDate || '',
        endDate: r.endDate || '',
        moveOutDate: document.getElementById('arc-moveout').value || new Date().toISOString().slice(0, 10),
        depositStatus: document.getElementById('arc-deposit').value,
        notes: (document.getElementById('arc-notes').value || '').trim()
      };
      appState.expiredContracts.unshift(record);
      appState.tenants.forEach(t => {
        if (String(t.room) === String(roomId)) {
          t.room = '';
          t.tenantStatus = 'Đã rời đi';
        }
      });
      r.status = 'vacant';
      r.startDate = '';
      r.endDate = '';
      r.otp = '';
      r.otpLocked = true;

      await saveEncryptedVault();
      await pushActionToSheet('archiveContract', { record, room: r });
      closeModal();
      render();
      showToast(`Đã chuyển Phòng ${roomId} sang HĐ Hết hiệu lực và giải phóng phòng trống.`, 'success');
    }

    function importTenantsCsv(e) {
      const file = e.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async () => {
        try {
          const text = String(reader.result || '').replace(/^\uFEFF/, '');
          const rows = parseCsvText(text);
          if (rows.length < 2) { showToast('File CSV không có dữ liệu.', 'warning'); return; }
          let added = 0;
          for (let i = 1; i < rows.length; i++) {
            const r = rows[i];
            const fullName = (r[3] || '').trim();
            if (!fullName) continue;
            let cccd = (r[1] || '').replace(/[^0-9]/g, '');
            if (cccd && cccd.length >= 9 && cccd.length < 12) cccd = cccd.padStart(12, '0');
            let phone = (r[10] || '').replace(/[^0-9]/g, '');
            if (phone && phone.length === 9 && !phone.startsWith('0')) phone = '0' + phone;
            const roomMatch = String(r[8] || '').match(/([2-7]0[1-3])/);
            appState.tenants.push({
              id: 'CSV_' + Date.now() + '_' + i,
              cccd, fullName,
              gender: (r[4] || '').trim(),
              dob: (r[5] || '').trim(),
              address: (r[6] || '').trim(),
              cccdDate: (r[7] || '').trim(),
              cccdPlace: 'Cục Cảnh sát QLHC về TTXH',
              room: roomMatch ? roomMatch[1] : '',
              phone,
              roleInRoom: 'Đại diện',
              job: (r[17] || '').trim(),
              residenceStatus: 'Chưa khai báo',
              residenceExpiry: ''
            });
            added++;
          }
          await saveEncryptedVault();
          render();
          showToast(`Đã nhập thành công ${added} hồ sơ từ CSV!`, 'success');
        } catch (err) {
          showToast('Lỗi đọc file CSV: ' + err.message, 'error');
        }
      };
      reader.readAsText(file, 'utf-8');
      e.target.value = '';
    }

    function parseCsvText(str) {
      const arr = [];
      let quote = false, row = [''], col = 0;
      for (let i = 0; i < str.length; i++) {
        const c = str[i], next = str[i + 1];
        if (c === '"' && quote && next === '"') { row[col] += '"'; i++; }
        else if (c === '"') { quote = !quote; }
        else if (c === ',' && !quote) { row[++col] = ''; }
        else if ((c === '\r' && next === '\n' || c === '\n' || c === '\r') && !quote) {
          if (c === '\r' && next === '\n') i++;
          arr.push(row); row = ['']; col = 0;
        } else { row[col] += c; }
      }
      if (row.some(x => x)) arr.push(row);
      return arr;
    }

    function exportTenantsCsv() {
      const headers = ['STT','Số CCCD','Họ và tên','Giới tính','Ngày sinh','Nơi thường trú','Ngày cấp CCCD','Phòng thuê','OTP','Số điện thoại','Vai trò','Nghề nghiệp','Trạng thái tạm trú','Hạn tạm trú'];
      const lines = [headers.join(',')];
      appState.tenants.forEach((t, idx) => {
        const otp = t.room && appState.rooms[t.room] ? appState.rooms[t.room].otp : '';
        const vals = [idx + 1, t.cccd, t.fullName, t.gender, t.dob, t.address, t.cccdDate, t.room, otp, t.phone, t.roleInRoom, t.job, t.residenceStatus, t.residenceExpiry];
        lines.push(vals.map(v => `"${String(v || '').replace(/"/g, '""')}"`).join(','));
      });
      const blob = new Blob(['\uFEFF' + lines.join('\n')], { type: 'text/csv;charset=utf-8;' });

    function exportContractWord(roomId) {
      const html = document.getElementById('contract-editor')?.innerHTML || buildFullContractHtml(roomId);
      const doc = `

    function genRandomOtp(roomId) {
      let code = '';
      const used = new Set(ALL_ROOM_IDS.filter(x => x !== roomId).map(x => appState.rooms[x]?.otp).filter(Boolean));
      for (let i = 0; i < 30; i++) {
        code = String(Math.floor(100000 + Math.random() * 900000));
        if (!used.has(code)) break;
      }
      const el = document.getElementById('otp-val-' + roomId);
      if (el) el.value = code;
    }

    async function saveRoomOtp(roomId) {
      const val = (document.getElementById('otp-val-' + roomId)?.value || '').trim();
      if (val) {
        const dup = ALL_ROOM_IDS.find(id => id !== roomId && appState.rooms[id]?.otp === val);
        if (dup) {
          showToast(`Mã OTP "${val}" đang trùng với Phòng ${dup}! Vui lòng chọn mã duy nhất.`, 'error');
          return;
        }
      }
      appState.rooms[roomId].otp = val;
      appState.rooms[roomId].otpLocked = false;
      await saveEncryptedVault();
      await pushActionToSheet('updateOtp', { roomId, otp: val, locked: false });
      render();
      showToast(`Đã lưu OTP Phòng ${roomId} và đồng bộ lên Cột J Google Sheet!`, 'success');
    }

    async function toggleLockOtp(roomId) {
      const r = appState.rooms[roomId];
      r.otpLocked = !r.otpLocked;
      await saveEncryptedVault();
      await pushActionToSheet('updateOtp', { roomId, otp: r.otp || '', locked: r.otpLocked });
      render();
      showToast(r.otpLocked ? `Đã khóa OTP Phòng ${roomId}.` : `Đã mở khóa OTP Phòng ${roomId}.`, 'info');
    }

    function copyZaloOtp(roomId) {
      const otp = appState.rooms[roomId]?.otp;
      if (!otp) { showToast('Phòng này chưa có mã OTP.', 'warning'); return; }
      const msg = `Chào bạn, Ban quản lý tòa nhà 19 Sân Quần gửi bạn mã OTP đăng nhập Cổng Khách thuê Phòng ${roomId}: ${otp}\n(Chỉ cần chọn "Tôi là Khách thuê" và nhập mã OTP này để xem hạn hợp đồng, tạm trú & khai báo người thân lưu trú).`;
      copyTextSafe(msg, `Đã copy tin nhắn OTP Phòng ${roomId} để gửi Zalo!`);
    }

    async function submitTenantGuestStay(e) {
      e.preventDefault();
      if (!session.guestCccd.front || !session.guestCccd.back) {
        showToast('Vui lòng chụp hoặc tải đủ 2 mặt ảnh CCCD của người lưu trú.', 'warning');
        return;
      }
      const btn = document.getElementById('gs-submit-btn');
      if (btn) { btn.disabled = true; btn.textContent = 'Đang gửi ảnh lên hệ thống...'; }
      const record = {
        id: 'GS_' + Date.now(),
        roomId: session.tenantRoomId,
        guestName: (document.getElementById('gs-name').value || '').trim(),
        relation: (document.getElementById('gs-rel').value || '').trim() || 'Người thân',
        guestPhone: (document.getElementById('gs-phone').value || '').trim(),
        duration: document.getElementById('gs-duration').value,
        arrivalDate: document.getElementById('gs-arrival').value,
        notes: (document.getElementById('gs-notes').value || '').trim(),
        cccdFront: session.guestCccd.front,
        cccdBack: session.guestCccd.back,
        status: 'Mới gửi',
        createdAt: new Date().toLocaleString('vi-VN')
      };
      try {
        if (isSheetConnected() && session.tenantOtp) {
          const res = await callSheetApi({ action: 'submitGuestStay', otp: session.tenantOtp, record });
          if (res.frontUrl) record.cccdFront = res.frontUrl;
          if (res.backUrl) record.cccdBack = res.backUrl;
        } else {
          const queued = JSON.parse(safeStorageGet(GUEST_QUEUE_KEY) || '[]');
          queued.unshift(record);
          safeStorageSet(GUEST_QUEUE_KEY, JSON.stringify(queued));
        }
        session.tenantGuestStays.unshift(record);
        session.guestCccd = { front: '', back: '' };
        render();
        showToast('Đã gửi khai báo lưu trú & ảnh CCCD cho Chủ nhà thành công!', 'success');
      } catch (err) {
        showToast('Lỗi gửi khai báo: ' + err.message, 'error');
      } finally {
        if (btn) { btn.disabled = false; btn.textContent = 'Gửi khai báo lưu trú cho Chủ nhà'; }
      }
    }

    function renderCccdSlotInner(src, side) {
      if (!src) {
        return `<div class="text-center p-3 text-slate-400">

      if (src.startsWith('http')) {

    function updateCccdPreview(scope, side, dataUrl) {
      if (scope === 'crm') session.tempCccd[side] = dataUrl;
      else session.guestCccd[side] = dataUrl;
      const box = document.getElementById(`${scope}-cccd-preview-${side}`);

    function handleCccdFileUpload(e, scope, side) {
      const file = e.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const maxW = 900;
          const scale = Math.min(1, maxW / img.width);
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          updateCccdPreview(scope, side, canvas.toDataURL('image/jpeg', 0.82));
          showToast('Đã tải ảnh CCCD thành công!', 'success');
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
      e.target.value = '';
    }

    function stopCameraStream() {

    async function startCameraStream() {
      stopCameraStream();
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: session.cameraFacing, width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
        session.cameraStream = stream;
        const v = document.getElementById('cccd-video');
        if (v) v.srcObject = stream;
      } catch (_) {
        showToast('Trình duyệt không cấp quyền Camera Live trong khung này. Hãy bấm nút "Tải ảnh / Chọn ảnh" để chụp trực tiếp bằng điện thoại.', 'warning');
        closeCameraModal();
      }
    }

    async function switchCameraFacing() {
      session.cameraFacing = session.cameraFacing === 'environment' ? 'user' : 'environment';
      await startCameraStream();
    }

    function captureCccdPhoto() {
      const v = document.getElementById('cccd-video');
      if (!v || !v.videoWidth || !session.cameraTarget) return;
      const targetRatio = 85.6 / 53.98;
      const vw = v.videoWidth, vh = v.videoHeight;
      let sx = 0, sy = 0, sw = vw, sh = vh;
      if (vw / vh > targetRatio) {
        sw = vh * targetRatio;
        sx = (vw - sw) / 2;
      } else {
        sh = vw / targetRatio;
        sy = (vh - sh) / 2;
      }
      const canvas = document.createElement('canvas');
      canvas.width = 900;
      canvas.height = Math.round(900 / targetRatio);
      canvas.getContext('2d').drawImage(v, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
      updateCccdPreview(session.cameraTarget.scope, session.cameraTarget.side, dataUrl);
      closeCameraModal();
      showToast('Đã chụp ảnh CCCD chuẩn khung thẻ!', 'success');
    }

    function closeCameraModal() {
      stopCameraStream();
      const el = document.getElementById('camera-overlay');
      if (el) el.remove();
    }

          ${inGas ? `
            <div class="p-4 rounded-2xl bg-emerald-50 border border-emerald-200 text-xs text-emerald-900 space-y-2">
              <div class="font-extrabold flex items-center gap-1.5"><i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-600"></i> Đang chạy trực tiếp trên Google Apps Script</div>
              <p>Giao diện <code>index.html</code> đã kết nối thẳng với Google Sheet chứa nó (không cần dán URL <code>/exec</code>). Bấm <strong>Kiểm tra</strong> để xem tên Sheet và số hồ sơ đọc được.</p>
              <div class="flex gap-2 pt-1">
                <button onclick="diagnoseSheetConnection()" class="px-4 py-2 rounded-full bg-white hover:bg-emerald-100 border border-emerald-300 text-emerald-800 font-bold">Kiểm tra Sheet</button>
                <button onclick="closeModal(); syncFromSheet(false);" class="px-4 py-2 rounded-full bg-[#156B68] hover:bg-[#0F5350] text-white font-bold">Đồng bộ ngay</button>
              </div>
            </div>
          ` : `
            <div class="space-y-2">
              <label class="block text-xs font-bold text-slate-700">URL Web App Google Apps Script (/exec)</label>
              <div class="flex flex-col sm:flex-row gap-2">
                <input id="sheet-url-input" type="url" value="${escapeHtml(currentUrl)}" placeholder="https://script.google.com/macros/s/.../exec"
                  class="flex-1 px-3.5 py-2.5 rounded-2xl border border-slate-200 text-xs font-mono" />
                <button onclick="saveSheetUrl()" class="px-5 py-2.5 rounded-full bg-[#156B68] hover:bg-[#0F5350] text-white text-xs font-bold shrink-0">Lưu & Đồng bộ</button>
                <button onclick="diagnoseSheetConnection()" class="px-4 py-2.5 rounded-full bg-sky-50 hover:bg-sky-100 text-sky-700 border border-sky-200 text-xs font-bold shrink-0">Kiểm tra</button>
              </div>
            </div>
          `}

          <div id="sheet-diag-box" class="hidden p-3.5 rounded-2xl text-xs border"></div>
        </div>
      `, 'max-w-xl');
    }

    async function diagnoseSheetConnection() {
      const inGas = isRunningInAppsScript();
      const box = document.getElementById('sheet-diag-box');
      if (!box) return;
      if (!inGas) {
        const url = (document.getElementById('sheet-url-input')?.value || '').trim();
        if (!url) {
          box.className = 'p-3.5 rounded-2xl text-xs border bg-rose-50 border-rose-200 text-rose-800';
          box.textContent = 'Vui lòng dán URL Web App (/exec) trước khi kiểm tra.';
          return;
        }
        safeStorageSet(SHEET_URL_STORAGE_KEY, url);
      }
      box.className = 'p-3.5 rounded-2xl text-xs border bg-slate-50 border-slate-200 text-slate-700';
      box.textContent = 'Đang kiểm tra kết nối và quét dữ liệu trên Google Sheet...';
      try {
        const res = await callSheetApi({ action: 'getData', proof: session.adminApiProof });
        const meta = res.meta || {};
        const count = Array.isArray(res.tenants) ? res.tenants.length : 0;
        box.className = 'p-3.5 rounded-2xl text-xs border bg-emerald-50 border-emerald-200 text-emerald-900';
        box.innerHTML = `<strong>Kết nối V4 chuẩn xác!</strong> Đang đọc sheet <strong>"${escapeHtml(meta.sheetName || '')}"</strong> (dòng tiêu đề: ${meta.headerRow || 1}, tổng ${meta.totalRows || 0} dòng) → tìm thấy <strong>${count} hồ sơ khách thuê</strong>.`;
      } catch (err) {
        box.className = 'p-3.5 rounded-2xl text-xs border bg-rose-50 border-rose-200 text-rose-800';
        box.textContent = 'Lỗi kết nối: ' + err.message;
      }
    }

    async function saveSheetUrl() {
      const val = (document.getElementById('sheet-url-input')?.value || '').trim();
      safeStorageSet(SHEET_URL_STORAGE_KEY, val);
      closeModal();
      render();
      if (val) {
        showToast('Đã lưu URL Google Sheet. Đang đồng bộ dữ liệu...', 'info');
        await syncFromSheet(false);
      } else {
        showToast('Đã ngắt kết nối Google Sheet, chuyển về chế độ mã hóa cục bộ.', 'info');
      }
    }

    // =========================================================================
    // 10. KHỞI CHẠY ỨNG DỤNG
    // =========================================================================
    function render() {
      const root = document.getElementById('app');
      if (!root) return;

      if (!session.role) {
        root.innerHTML = renderAuth();
      } else if (session.role === 'landlord') {
        root.innerHTML = renderLandlord();
      } else if (session.role === 'tenant') {
        root.innerHTML = renderTenant();
      }

      if (window.lucide) lucide.createIcons();
    }

    window.addEventListener('DOMContentLoaded', () => {
      render();
    });
  </script>
</body>
</html>
